<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تعبئة النماذج</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f1f1;
      color: #222;
      font-family: Arial, sans-serif;
    }

    header {
      background: white;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .toolbar {
      width: min(96%, 900px);
      margin: 12px auto;
      background: white;
      padding: 12px;
      border-radius: 12px;
    }

    .toolbar button,
    .toolbar label {
      display: inline-block;
      border: 0;
      border-radius: 9px;
      padding: 12px 16px;
      margin: 4px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .toolbar label {
      background: #333;
    }

    input[type="file"] {
      display: none;
    }

    .instructions {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.7;
      color: #666;
    }

    .workspace {
      width: min(96%, 900px);
      margin: auto;
      background: white;
      padding: 10px;
      border-radius: 12px;
      overflow: auto;
    }

    #formArea {
      position: relative;
      display: inline-block;
      line-height: 0;
      touch-action: manipulation;
    }

    #formImage {
      display: none;
      width: auto;
      max-width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #emptyMessage {
      padding: 45px 20px;
      text-align: center;
      color: #777;
      line-height: 1.8;
    }

    .field {
      position: absolute;
      border: 2px solid #1976d2;
      background: rgba(255,255,255,0.88);
      z-index: 10;
      line-height: normal;
      min-width: 25px;
      min-height: 25px;
    }

    .field input {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 25px;
      min-height: 25px;
      padding: 2px 5px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #000;
      font-family: Arial, sans-serif;
      font-size: 16px;
      text-align: left;
      direction: ltr;
    }

    .field textarea {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #000;
    }

    .field .delete {
      position: absolute;
      top: -24px;
      right: -2px;
      background: #c62828;
      color: white;
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 11px;
      line-height: normal;
      cursor: pointer;
    }

    .check-field {
      position: absolute;
      z-index: 11;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.85);
      border: 2px solid #1976d2;
      color: #000;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .message {
      display: none;
      margin-top: 10px;
      padding: 9px;
      border-radius: 7px;
      background: #eee;
      font-size: 14px;
    }

    .zoom-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
    }

    .zoom-row button {
      padding: 8px 12px;
      margin: 0;
    }

    #zoomValue {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<header>
  <h1>تعبئة النموذج</h1>
</header>

<div class="toolbar">

  <label>
    📷 اختيار صورة النموذج
    <input type="file" id="imageInput" accept="image/*">
  </label>

  <button type="button" id="clearFields">
    🗑️ مسح الخانات
  </button>

  <button type="button" id="saveImage">
    💾 حفظ النموذج
  </button>

  <div class="instructions">
    <b>طريقة الاستخدام:</b><br>
    ارفع صورة النموذج، ثم اضغط مباشرة داخل الفراغ الذي تريد تعبئته.
    سيحاول التطبيق تحديد الخانة الموجودة في الصورة ووضع الكتابة داخلها.
  </div>

  <div class="zoom-row">
    <button type="button" id="zoomOut">−</button>
    <span id="zoomValue">100%</span>
    <button type="button" id="zoomIn">+</button>
  </div>

  <div id="message" class="message"></div>

</div>

<div class="workspace">

  <div id="formArea">

    <div id="emptyMessage">
      📄<br>
      لم يتم اختيار صورة بعد.<br>
      اضغط «اختيار صورة النموذج».
    </div>

    <img id="formImage" alt="صورة النموذج">

  </div>

</div>


<script>

const imageInput = document.getElementById("imageInput");
const formImage = document.getElementById("formImage");
const formArea = document.getElementById("formArea");
const emptyMessage = document.getElementById("emptyMessage");
const saveImageButton = document.getElementById("saveImage");
const clearFieldsButton = document.getElementById("clearFields");
const messageBox = document.getElementById("message");
const zoomIn = document.getElementById("zoomIn");
const zoomOut = document.getElementById("zoomOut");
const zoomValue = document.getElementById("zoomValue");

let fields = [];
let zoom = 1;


/* =========================================
   رسالة
========================================= */

function showMessage(text) {

  messageBox.textContent = text;
  messageBox.style.display = "block";

  clearTimeout(showMessage.timer);

  showMessage.timer = setTimeout(function () {
    messageBox.style.display = "none";
  }, 2500);
}


/* =========================================
   تحميل الصورة
========================================= */

imageInput.addEventListener("change", function () {

  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    showMessage("الملف المختار ليس صورة.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {

    formImage.src = event.target.result;

    formImage.onload = function () {

      formImage.style.display = "block";
      emptyMessage.style.display = "none";

      removeAllFields();

      zoom = 1;
      updateZoom();

      showMessage(
        "تم تحميل النموذج. اضغط الآن داخل أي خانة فارغة."
      );
    };

  };

  reader.readAsDataURL(file);
});


/* =========================================
   التكبير والتصغير
========================================= */

function updateZoom() {

  zoom = Math.max(0.5, Math.min(2.5, zoom));

  formImage.style.width =
    (formImage.naturalWidth * zoom) + "px";

  zoomValue.textContent =
    Math.round(zoom * 100) + "%";
}


zoomIn.addEventListener("click", function () {

  zoom += 0.1;

  updateZoom();

});


zoomOut.addEventListener("click", function () {

  zoom -= 0.1;

  updateZoom();

});


/* =========================================
   الضغط على الصورة
========================================= */

formImage.addEventListener("pointerdown", function (event) {

  if (!formImage.src) return;

  /*
    إحداثيات الضغط على الصورة المعروضة
  */

  const rect = formImage.getBoundingClientRect();

  const displayX = event.clientX - rect.left;
  const displayY = event.clientY - rect.top;

  /*
    تحويلها إلى إحداثيات الصورة الأصلية
  */

  const scaleX =
    formImage.naturalWidth / rect.width;

  const scaleY =
    formImage.naturalHeight / rect.height;

  const x =
    displayX * scaleX;

  const y =
    displayY * scaleY;


  /*
    أولاً نبحث عن مربع اختيار
  */

  const checkbox = detectCheckbox(x, y);

  if (checkbox) {

    createCheckbox(
      checkbox.x,
      checkbox.y,
      checkbox.size
    );

    return;
  }


  /*
    بعدها نبحث عن الخانة المستطيلة
  */

  const rectangle =
    detectFieldRectangle(x, y);

  if (rectangle) {

    createTextField(rectangle);

    return;
  }


  /*
    إذا لم نستطع اكتشاف المستطيل
  */

  createFallbackField(x, y);

});


/* =========================================
   قراءة لون الخط الأخضر
========================================= */

function isGreenPixel(r, g, b) {

  return (
    g > 90 &&
    g > r * 1.12 &&
    g > b * 1.05
  );
}


/* =========================================
   قراءة اللون الأسود
========================================= */

function isDarkPixel(r, g, b) {

  return (
    r < 90 &&
    g < 90 &&
    b < 90
  );
}


/* =========================================
   الحصول على بيانات الصورة
========================================= */

let imageCanvas = null;
let imageContext = null;
let imageData = null;


/*
  تجهيز نسخة صغيرة/كاملة من الصورة للتحليل
*/

function prepareImageAnalysis() {

  if (!formImage.naturalWidth) return;

  imageCanvas = document.createElement("canvas");

  imageCanvas.width = formImage.naturalWidth;
  imageCanvas.height = formImage.naturalHeight;

  imageContext = imageCanvas.getContext("2d", {
    willReadFrequently: true
  });

  imageContext.drawImage(
    formImage,
    0,
    0
  );

  imageData =
    imageContext.getImageData(
      0,
      0,
      imageCanvas.width,
      imageCanvas.height
    );

}


formImage.addEventListener("load", function () {

  prepareImageAnalysis();

});


/* =========================================
   فحص نقطة
========================================= */

function pixelAt(x, y) {

  if (!imageData) return null;

  x = Math.round(x);
  y = Math.round(y);

  if (
    x < 0 ||
    y < 0 ||
    x >= imageData.width ||
    y >= imageData.height
  ) {
    return null;
  }

  const i =
    (y * imageData.width + x) * 4;

  return {
    r: imageData.data[i],
    g: imageData.data[i + 1],
    b: imageData.data[i + 2]
  };
}


/* =========================================
   حساب نسبة الخط الأخضر في خط أفقي
========================================= */

function horizontalGreenScore(
  y,
  x1,
  x2
) {

  let count = 0;
  let total = 0;

  for (
    let x = x1;
    x <= x2;
    x += 2
  ) {

    const p = pixelAt(x, y);

    if (!p) continue;

    total++;

    if (
      isGreenPixel(
        p.r,
        p.g,
        p.b
      )
    ) {
      count++;
    }
  }

  if (!total) return 0;

  return count / total;
}


/* =========================================
   حساب نسبة الخط الأخضر عمودي
========================================= */

function verticalGreenScore(
  x,
  y1,
  y2
) {

  let count = 0;
  let total = 0;

  for (
    let y = y1;
    y <= y2;
    y += 2
  ) {

    const p = pixelAt(x, y);

    if (!p) continue;

    total++;

    if (
      isGreenPixel(
        p.r,
        p.g,
        p.b
      )
    ) {
      count++;
    }
  }

  if (!total) return 0;

  return count / total;
}


/* =========================================
   إيجاد أقرب خط أفقي أخضر
========================================= */

function findHorizontalLine(
  x,
  y,
  direction
) {

  const maxDistance = 350;

  for (
    let d = 0;
    d <= maxDistance;
    d++
  ) {

    const yy =
      y + d * direction;

    if (
      yy < 0 ||
      yy >= imageData.height
    ) {
      break;
    }


    /*
      نبحث حول نقطة الضغط
    */

    const localWidth = 80;

    const x1 =
      Math.max(
        0,
        x - localWidth
      );

    const x2 =
      Math.min(
        imageData.width - 1,
        x + localWidth
      );


    const score =
      horizontalGreenScore(
        yy,
        x1,
        x2
      );


    if (score > 0.42) {

      /*
        نوسّع الخط يمينًا ويسارًا
      */

      let left = x;

      let right = x;


      for (
        let xx = x;
        xx >= 0;
        xx--
      ) {

        const p =
          pixelAt(xx, yy);

        if (
          !p ||
          !isGreenPixel(
            p.r,
            p.g,
            p.b
          )
        ) {
          break;
        }

        left = xx;
      }


      for (
        let xx = x;
        xx < imageData.width;
        xx++
      ) {

        const p =
          pixelAt(xx, yy);

        if (
          !p ||
          !isGreenPixel(
            p.r,
            p.g,
            p.b
          )
        ) {
          break;
        }

        right = xx;
      }


      if (
        right - left >= 35
      ) {

        return {
          x1: left,
          x2: right,
          y: yy
        };

      }

    }

  }

  return null;
}


/* =========================================
   إيجاد أقرب خط عمودي أخضر
========================================= */

function findVerticalLine(
  x,
  y,
  direction
) {

  const maxDistance = 500;

  for (
    let d = 0;
    d <= maxDistance;
    d++
  ) {

    const xx =
      x + d * direction;

    if (
      xx < 0 ||
      xx >= imageData.width
    ) {
      break;
    }

    const localHeight = 80;

    const y1 =
      Math.max(
        0,
        y - localHeight
      );

    const y2 =
      Math.min(
        imageData.height - 1,
        y + localHeight
      );


    const score =
      verticalGreenScore(
        xx,
        y1,
        y2
      );


    if (score > 0.42) {

      let top = y;
      let bottom = y;


      for (
        let yy = y;
        yy >= 0;
        yy--
      ) {

        const p =
          pixelAt(xx, yy);

        if (
          !p ||
          !isGreenPixel(
            p.r,
            p.g,
            p.b
          )
        ) {
          break;
        }

        top = yy;
      }


      for (
        let yy = y;
        yy < imageData.height;
        yy++
      ) {

        const p =
          pixelAt(xx, yy);

        if (
          !p ||
          !isGreenPixel(
            p.r,
            p.g,
            p.b
          )
        ) {
          break;
        }

        bottom = yy;
      }


      if (
        bottom - top >= 20
      ) {

        return {
          x: xx,
          y1: top,
          y2: bottom
        };

      }

    }

  }

  return null;
}


/* =========================================
   اكتشاف المستطيل
========================================= */

function detectFieldRectangle(x, y) {

  if (!imageData) {
    prepareImageAnalysis();
  }

  if (!imageData) return null;


  const top =
    findHorizontalLine(
      x,
      y,
      -1
    );

  const bottom =
    findHorizontalLine(
      x,
      y,
      1
    );

  const left =
    findVerticalLine(
      x,
      y,
      -1
    );

  const right =
    findVerticalLine(
      x,
      y,
      1
    );


  if (
    !top ||
    !bottom ||
    !left ||
    !right
  ) {
    return null;
  }


  let x1 = left.x;
  let x2 = right.x;
  let y1 = top.y;
  let y2 = bottom.y;


  if (
    x2 <= x1 ||
    y2 <= y1
  ) {
    return null;
  }


  const width = x2 - x1;
  const height = y2 - y1;


  /*
    منع التقاط الإطار الكبير للنموذج
  */

  if (
    width > imageData.width * 0.95 ||
    height > imageData.height * 0.7
  ) {
    return null;
  }


  /*
    منع المستطيلات الصغيرة جدًا
  */

  if (
    width < 25 ||
    height < 15
  ) {
    return null;
  }


  /*
    التأكد أن نقطة الضغط داخل المستطيل
  */

  if (
    x < x1 ||
    x > x2 ||
    y < y1 ||
    y > y2
  ) {
    return null;
  }


  return {
    x: x1,
    y: y1,
    width: width,
    height: height
  };

}


/* =========================================
   اكتشاف مربع الاختيار
========================================= */

function detectCheckbox(x, y) {

  if (!imageData) return null;


  const searchRadius = 45;


  let best = null;


  for (
    let yy = Math.max(0, y - searchRadius);
    yy <= Math.min(
      imageData.height - 1,
      y + searchRadius
    );
    yy++
  ) {

    for (
      let xx = Math.max(0, x - searchRadius);
      xx <= Math.min(
        imageData.width - 1,
        x + searchRadius
      );
      xx++
    ) {

      /*
        نبحث عن مربع أسود تقريبًا
      */

      let horizontal = 0;
      let vertical = 0;


      for (
        let dx = -12;
        dx <= 12;
        dx++
      ) {

        const p =
          pixelAt(
            xx + dx,
            yy - 12
          );

        if (
          p &&
          isDarkPixel(
            p.r,
            p.g,
            p.b
          )
        ) {
          horizontal++;
        }


        const p2 =
          pixelAt(
            xx + dx,
            yy + 12
          );

        if (
          p2 &&
          isDarkPixel(
            p2.r,
            p2.g,
            p2.b
          )
        ) {
          horizontal++;
        }

      }


      for (
        let dy = -12;
        dy <= 12;
        dy++
      ) {

        const p =
          pixelAt(
            xx - 12,
            yy + dy
          );

        if (
          p &&
          isDarkPixel(
            p.r,
            p.g,
            p.b
          )
        ) {
          vertical++;
        }


        const p2 =
          pixelAt(
            xx + 12,
            yy + dy
          );

        if (
          p2 &&
          isDarkPixel(
            p2.r,
            p2.g,
            p2.b
          )
        ) {
          vertical++;
        }

      }


      if (
        horizontal >= 12 &&
        vertical >= 12
      ) {

        const distance =
          Math.hypot(
            xx - x,
            yy - y
          );


        if (
          !best ||
          distance < best.distance
        ) {

          best = {
            x: xx - 12,
            y: yy - 12,
            size: 24,
            distance: distance
          };

        }

      }

    }

  }


  return best;
}


/* =========================================
   إنشاء خانة كتابة
========================================= */

function createTextField(rectangle) {

  /*
    إذا كانت هناك خانة موجودة في نفس المكان
    لا ننشئ واحدة ثانية
  */

  const existing =
    fields.find(function(field) {

      if (
        field.type !== "text"
      ) {
        return false;
      }

      return (
        Math.abs(
          field.x - rectangle.x
        ) < 10 &&
        Math.abs(
          field.y - rectangle.y
        ) < 10
      );

    });


  if (existing) {

    existing.element
      .querySelector("input")
      .focus();

    return;
  }


  const field =
    document.createElement("div");

  field.className = "field";


  /*
    تحويل إحداثيات الصورة الأصلية
    إلى إحداثيات العرض الحالي
  */

  const scale =
    formImage.clientWidth /
    formImage.naturalWidth;


  field.style.left =
    (rectangle.x * scale) + "px";

  field.style.top =
    (rectangle.y * scale) + "px";

  field.style.width =
    (rectangle.width * scale) + "px";

  field.style.height =
    (rectangle.height * scale) + "px";


  const input =
    document.createElement("input");

  input.type = "text";

  input.autocomplete = "off";

  input.spellcheck = false;


  const deleteButton =
    document.createElement("span");

  deleteButton.className = "delete";

  deleteButton.textContent = "حذف";


  deleteButton.addEventListener(
    "pointerdown",
    function(event) {

      event.stopPropagation();

      field.remove();

      fields =
        fields.filter(
          f => f.element !== field
        );

    }
  );


  field.appendChild(input);
  field.appendChild(deleteButton);

  formArea.appendChild(field);


  const item = {
    type: "text",
    element: field,
    x: rectangle.x,
    y: rectangle.y,
    width: rectangle.width,
    height: rectangle.height
  };


  fields.push(item);


  input.focus();

}


/* =========================================
   خانة احتياطية
========================================= */

function createFallbackField(x, y) {

  const width = 220;
  const height = 45;


  const rectangle = {

    x: Math.max(
      0,
      Math.min(
        imageData.width - width,
        x - width / 2
      )
    ),

    y: Math.max(
      0,
      Math.min(
        imageData.height - height,
        y - height / 2
      )
    ),

    width: width,
    height: height

  };


  createTextField(rectangle);

  showMessage(
    "لم أجد حدود الخانة بوضوح، لذلك وضعت خانة صغيرة في مكان الضغط."
  );

}


/* =========================================
   إنشاء مربع اختيار
========================================= */

function createCheckbox(
  x,
  y,
  size
) {

  const scale =
    formImage.clientWidth /
    formImage.naturalWidth;


  const box =
    document.createElement("div");

  box.className =
    "check-field";


  box.style.left =
    (x * scale) + "px";

  box.style.top =
    (y * scale) + "px";

  box.style.width =
    (size * scale) + "px";

  box.style.height =
    (size * scale) + "px";


  box.textContent = "✓";


  let checked = true;


  box.addEventListener(
    "pointerdown",
    function(event) {

      event.stopPropagation();

      checked = !checked;

      box.textContent =
        checked ? "✓" : "";

    }
  );


  formArea.appendChild(box);


  fields.push({

    type: "checkbox",

    element: box,

    x: x,

    y: y,

    width: size,

    height: size,

    checked: true

  });

}


/* =========================================
   مسح الخانات
========================================= */

function removeAllFields() {

  fields.forEach(function(field) {

    if (
      field.element &&
      field.element.parentNode
    ) {

      field.element.remove();

    }

  });

  fields = [];

}


clearFieldsButton.addEventListener(
  "click",
  function() {

    if (!fields.length) {
      showMessage("لا توجد خانات لمسحها.");
      return;
    }

    removeAllFields();

    showMessage("تم مسح جميع الخانات.");

  }
);


/* =========================================
   إعادة وضع الخانات بعد التكبير
========================================= */

function repositionFields() {

  const scale =
    formImage.clientWidth /
    formImage.naturalWidth;


  fields.forEach(function(field) {

    const element =
      field.element;


    element.style.left =
      (field.x * scale) + "px";

    element.style.top =
      (field.y * scale) + "px";

    element.style.width =
      (field.width * scale) + "px";

    element.style.height =
      (field.height * scale) + "px";

  });

}


/*
  نراقب تغيير حجم الصورة
*/

const resizeObserver =
  new ResizeObserver(function() {

    repositionFields();

  });


resizeObserver.observe(formImage);


/* =========================================
   حفظ النموذج
========================================= */

saveImageButton.addEventListener(
  "click",
  function() {

    if (
      !formImage.src ||
      !formImage.naturalWidth
    ) {

      showMessage(
        "اختر صورة النموذج أولاً."
      );

      return;
    }


    const canvas =
      document.createElement("canvas");

    canvas.width =
      formImage.naturalWidth;

    canvas.height =
      formImage.naturalHeight;


    const ctx =
      canvas.getContext("2d");


    /*
      الصورة الأصلية
    */

    ctx.drawImage(
      formImage,
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
      الكتابة
    */

    fields.forEach(function(field) {

      if (
        field.type === "checkbox"
      ) {

        if (
          field.element.textContent.trim() === "✓"
        ) {

          ctx.font =
            `${Math.max(
              14,
              field.height * 0.8
            )}px Arial`;

          ctx.fillStyle = "#000";

          ctx.textAlign = "center";

          ctx.textBaseline = "middle";

          ctx.fillText(
            "✓",
            field.x + field.width / 2,
            field.y + field.height / 2
          );

        }

        return;
      }


      const input =
        field.element.querySelector("input");


      if (
        !input ||
        !input.value.trim()
      ) {
        return;
      }


      /*
        نمسح فقط داخل الخانة
        ثم نكتب النص
      */

      ctx.fillStyle = "white";

      ctx.fillRect(
        field.x,
        field.y,
        field.width,
        field.height
      );


      ctx.fillStyle = "#000";

      ctx.textAlign = "left";

      ctx.textBaseline = "middle";


      let fontSize =
        Math.max(
          12,
          field.height * 0.55
        );


      ctx.font =
        `${fontSize}px Arial`;


      ctx.fillText(
        input.value,
        field.x + 5,
        field.y + field.height / 2
      );

    });


    /*
      تحميل الصورة
    */

    const link =
      document.createElement("a");

    link.download =
      "formular-ausgefüllt.png";

    link.href =
      canvas.toDataURL(
        "image/png"
      );

    link.click();


    showMessage(
      "تم تجهيز النموذج وحفظه."
    );

  }
);


/* =========================================
   منع سحب الصورة
========================================= */

formImage.addEventListener(
  "dragstart",
  function(event) {

    event.preventDefault();

  }
);

</script>
