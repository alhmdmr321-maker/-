<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعبئة النماذج الذكية</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f2f2f2;
    font-family: Arial, sans-serif;
    direction: rtl;
}

header {
    background: #111;
    color: white;
    padding: 15px;
    text-align: center;
}

.controls {
    padding: 12px;
    background: white;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

button,
label {
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 4px;
    font-size: 15px;
    cursor: pointer;
}

.upload {
    background: #1976d2;
    color: white;
}

.save {
    background: #16803c;
    color: white;
}

.scan {
    background: #7b1fa2;
    color: white;
}

#status {
    margin-top: 8px;
    font-size: 14px;
    color: #555;
}

.workspace {
    width: 100%;
    overflow: auto;
    padding: 12px;
}

#formContainer {
    position: relative;
    margin: auto;
    width: fit-content;
}

#formImage {
    display: block;
    max-width: none;
    user-select: none;
}

.detectedField {
    position: absolute;
    border: 2px solid rgba(0, 140, 255, .75);
    background: rgba(255,255,255,.12);
    border-radius: 3px;
    cursor: text;
    z-index: 5;
}

.detectedField input {
    width: 100%;
    height: 100%;
    border: 0;
    outline: none;
    background: rgba(255,255,255,.82);
    font-size: 18px;
    padding: 3px 5px;
    direction: ltr;
    color: #000;
}

.detectedField input:focus {
    background: rgba(255,255,255,.95);
}

.fieldLabel {
    position: absolute;
    top: -22px;
    right: 0;
    font-size: 11px;
    background: #1976d2;
    color: white;
    padding: 2px 5px;
    border-radius: 3px;
    white-space: nowrap;
}

.hidden {
    display: none;
}

input[type="file"] {
    display: none;
}
</style>
</head>

<body>

<header>
    <h2>تعبئة النماذج الذكية</h2>
    <div>ارفع النموذج وسيتم تحليل أماكن التعبئة تلقائياً</div>
</header>

<div class="controls">

    <label class="upload">
        📷 اختيار صورة النموذج
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <button class="scan" id="scanButton">
        🔍 تحليل النموذج
    </button>

    <button class="save" id="saveButton">
        💾 حفظ النموذج
    </button>

    <div id="status">
        لم يتم اختيار صورة بعد
    </div>

</div>

<div class="workspace">

    <div id="formContainer">

        <img id="formImage" class="hidden">

    </div>

</div>


<script>

const imageInput = document.getElementById("imageInput");
const formImage = document.getElementById("formImage");
const formContainer = document.getElementById("formContainer");
const statusBox = document.getElementById("status");
const scanButton = document.getElementById("scanButton");
const saveButton = document.getElementById("saveButton");

let originalImage = null;
let detectedFields = [];


/* =========================
   اختيار الصورة
========================= */

imageInput.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        originalImage = new Image();

        originalImage.onload = function() {

            formImage.src = event.target.result;
            formImage.classList.remove("hidden");

            formImage.style.width = originalImage.naturalWidth + "px";
            formImage.style.height = originalImage.naturalHeight + "px";

            clearFields();

            statusBox.textContent =
                "تم تحميل الصورة. اضغط «تحليل النموذج».";

        };

        originalImage.src = event.target.result;

    };

    reader.readAsDataURL(file);

});


/* =========================
   حذف الحقول السابقة
========================= */

function clearFields() {

    detectedFields = [];

    const fields =
        formContainer.querySelectorAll(".detectedField");

    fields.forEach(field => field.remove());

}


/* =========================
   تحليل OCR
========================= */

scanButton.addEventListener("click", async function() {

    if (!originalImage) {

        alert("اختار صورة النموذج أولاً.");

        return;
    }

    clearFields();

    statusBox.textContent =
        "⏳ جاري قراءة النص الموجود في النموذج...";

    try {

        const result =
            await Tesseract.recognize(
                originalImage,
                "deu+eng",
                {
                    logger: function(info) {

                        if (info.status === "recognizing text") {

                            const percent =
                                Math.round(info.progress * 100);

                            statusBox.textContent =
                                "🔍 قراءة النموذج: " +
                                percent +
                                "%";

                        }

                    }
                }
            );

        const words = result.data.words || [];

        statusBox.textContent =
            "🧠 تم قراءة النموذج. جاري اكتشاف أماكن التعبئة...";

        detectedFields =
            detectFields(words);

        drawDetectedFields(detectedFields);

        statusBox.textContent =
            "✅ تم اكتشاف " +
            detectedFields.length +
            " حقل قابل للتعبئة.";

    } catch (error) {

        console.error(error);

        statusBox.textContent =
            "❌ حدث خطأ أثناء تحليل الصورة.";

        alert(
            "تعذر تحليل النموذج. تأكد من اتصال الإنترنت ثم حاول مرة أخرى."
        );

    }

});


/* =========================
   كلمات الحقول المعروفة
========================= */

const fieldPatterns = [

    {
        name: "الاسم الأخير",
        patterns: [
            "familiennamen",
            "nachnamen",
            "familienname",
            "nachname",
            "surname",
            "last name"
        ]
    },

    {
        name: "الاسم الأول",
        patterns: [
            "vornamen",
            "vorname",
            "first name",
            "given name"
        ]
    },

    {
        name: "تاريخ الميلاد",
        patterns: [
            "geburtsdatum",
            "geburt",
            "date of birth",
            "birth"
        ]
    },

    {
        name: "الشارع",
        patterns: [
            "straße",
            "strasse",
            "gasse",
            "platz",
            "street",
            "address"
        ]
    },

    {
        name: "رقم المنزل",
        patterns: [
            "hausnummer",
            "house number"
        ]
    },

    {
        name: "الدرج",
        patterns: [
            "stiege"
        ]
    },

    {
        name: "الباب",
        patterns: [
            "tür",
            "tur"
        ]
    },

    {
        name: "الرمز البريدي",
        patterns: [
            "plz",
            "postleitzahl",
            "postal code",
            "zip"
        ]
    },

    {
        name: "المدينة",
        patterns: [
            "ort",
            "gemeinde",
            "city"
        ]
    },

    {
        name: "مفتاح الهاتف",
        patterns: [
            "vorwahl"
        ]
    },

    {
        name: "رقم الهاتف",
        patterns: [
            "telefonnummer",
            "telefon",
            "phone"
        ]
    },

    {
        name: "البريد الإلكتروني",
        patterns: [
            "e-mail",
            "email",
            "mail"
        ]
    },

    {
        name: "رقم المساهمة",
        patterns: [
            "beitragsnummer"
        ]
    }

];


/* =========================
   تنظيف النص
========================= */

function normalizeText(text) {

    return text
        .toLowerCase()
        .replace(/[^\p{L}\p{N}@.-]/gu, "")
        .trim();

}


/* =========================
   إيجاد اسم الحقل
========================= */

function findFieldName(text) {

    const normalized =
        normalizeText(text);

    for (const field of fieldPatterns) {

        for (const pattern of field.patterns) {

            const p =
                normalizeText(pattern);

            if (
                normalized.includes(p) ||
                p.includes(normalized)
            ) {

                return field.name;

            }

        }

    }

    return null;

}


/* =========================
   اكتشاف الحقول
========================= */

function detectFields(words) {

    const fields = [];

    for (let i = 0; i < words.length; i++) {

        const word = words[i];

        if (!word.text) continue;

        const fieldName =
            findFieldName(word.text);

        if (!fieldName) continue;


        /*
         * نبحث عن مساحة فارغة إلى يمين
         * عنوان الحقل.
         */

        let candidate = null;

        for (
            let j = 0;
            j < words.length;
            j++
        ) {

            if (i === j) continue;

            const other = words[j];

            const sameLine =
                Math.abs(
                    other.bbox.y0 -
                    word.bbox.y0
                ) < 45;

            if (!sameLine) continue;

            /*
             * في النموذج الألماني
             * غالباً مكان التعبئة يكون
             * بعد عنوان الحقل.
             */

            const distance =
                other.bbox.x0 -
                word.bbox.x1;

            if (
                distance > 10 &&
                distance < 500
            ) {

                candidate = other;

                break;

            }

        }


        /*
         * إذا لم نجد كلمة بعدها،
         * نحاول إنشاء مساحة فارغة
         * بجانب عنوان الحقل.
         */

        let x;
        let y;
        let width;
        let height;

        if (candidate) {

            x = word.bbox.x1 + 8;
            y = word.bbox.y0;

            width =
                Math.max(
                    100,
                    candidate.bbox.x0 -
                    word.bbox.x1 -
                    15
                );

            height =
                Math.max(
                    28,
                    word.bbox.y1 -
                    word.bbox.y0 +
                    10
                );

        } else {

            x = word.bbox.x1 + 8;
            y = word.bbox.y0;

            width = 220;
            height = 34;

        }


        /*
         * منع إنشاء حقول صغيرة جداً.
         */

        if (width < 70) continue;

        /*
         * منع التكرار.
         */

        const duplicate =
            fields.some(f =>
                Math.abs(f.x - x) < 20 &&
                Math.abs(f.y - y) < 20
            );

        if (duplicate) continue;


        fields.push({

            name: fieldName,

            x: x,
            y: y,

            width: width,
            height: height

        });

    }


    /*
     * محاولة إضافية لاكتشاف
     * الخطوط الفارغة الطويلة.
     */

    const lineFields =
        detectBlankLines();

    for (const line of lineFields) {

        const duplicate =
            fields.some(f =>
                Math.abs(f.x - line.x) < 25 &&
                Math.abs(f.y - line.y) < 25
            );

        if (!duplicate) {

            fields.push(line);

        }

    }


    return fields;

}


/* =========================
   اكتشاف الخطوط الفارغة
========================= */

function detectBlankLines() {

    const result = [];

    /*
     * هذه المرحلة اختيارية.
     * نستخدم Canvas لتحليل الخطوط.
     */

    try {

        const canvas =
            document.createElement("canvas");

        canvas.width =
            originalImage.naturalWidth;

        canvas.height =
            originalImage.naturalHeight;

        const ctx =
            canvas.getContext("2d");

        ctx.drawImage(
            originalImage,
            0,
            0
        );

        const imageData =
            ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

        const data =
            imageData.data;

        /*
         * البحث عن الخطوط الأفقية
         * الداكنة الطويلة.
         */

        for (
            let y = 0;
            y < canvas.height;
            y += 3
        ) {

            let start = -1;

            for (
                let x = 0;
                x < canvas.width;
                x++
            ) {

                const index =
                    (y * canvas.width + x) * 4;

                const r = data[index];
                const g = data[index + 1];
                const b = data[index + 2];

                const dark =
                    r < 130 &&
                    g < 130 &&
                    b < 130;

                if (dark && start === -1) {

                    start = x;

                }

                if (
                    (!dark || x === canvas.width - 1) &&
                    start !== -1
                ) {

                    const length =
                        x - start;

                    if (length > 120) {

                        /*
                         * الخط وحده لا يكفي
                         * لاعتباره حقل تعبئة.
                         *
                         * نضعه في قائمة المرشحين
                         * فقط إذا لم يكن مربع اختيار.
                         */

                        result.push({

                            name: "حقل مكتشف",

                            x: start,

                            y: y - 18,

                            width: length,

                            height: 30

                        });

                    }

                    start = -1;

                }

            }

        }

    } catch (e) {

        console.log(e);

    }

    /*
     * إزالة الحقول المتقاربة جداً.
     */

    const clean = [];

    for (const item of result) {

        const exists =
            clean.some(x =>
                Math.abs(x.x - item.x) < 30 &&
                Math.abs(x.y - item.y) < 25
            );

        if (!exists) {

            clean.push(item);

        }

    }

    return clean.slice(0, 40);

}


/* =========================
   رسم الحقول
========================= */

function drawDetectedFields(fields) {

    clearFields();

    const imageWidth =
        formImage.naturalWidth;

    const imageHeight =
        formImage.naturalHeight;

    fields.forEach((field, index) => {

        /*
         * تجاهل أي شيء خارج الصورة.
         */

        if (field.x < 0) return;
        if (field.y < 0) return;

        if (
            field.x >= imageWidth ||
            field.y >= imageHeight
        ) return;


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "detectedField";

        wrapper.style.left =
            field.x + "px";

        wrapper.style.top =
            field.y + "px";

        wrapper.style.width =
            field.width + "px";

        wrapper.style.height =
            field.height + "px";


        const label =
            document.createElement("div");

        label.className =
            "fieldLabel";

        label.textContent =
            field.name;

        wrapper.appendChild(label);


        const input =
            document.createElement("input");

        input.type = "text";

        input.placeholder =
            "اكتب هنا";

        input.dataset.field =
            field.name;

        wrapper.appendChild(input);


        formContainer.appendChild(wrapper);

    });

}


/* =========================
   حفظ النموذج
========================= */

saveButton.addEventListener("click", function() {

    if (!originalImage) {

        alert("لم يتم اختيار صورة.");

        return;

    }


    const canvas =
        document.createElement("canvas");

    canvas.width =
        originalImage.naturalWidth;

    canvas.height =
        originalImage.naturalHeight;

    const ctx =
        canvas.getContext("2d");


    /*
     * أولاً نرسم الصورة الأصلية فقط.
     */

    ctx.drawImage(
        originalImage,
        0,
        0
    );


    /*
     * ثم نرسم النصوص التي كتبها المستخدم.
     */

    const fields =
        formContainer.querySelectorAll(
            ".detectedField"
        );

    fields.forEach(field => {

        const input =
            field.querySelector("input");

        if (!input || !input.value) return;


        const x =
            parseFloat(field.style.left);

        const y =
            parseFloat(field.style.top);

        const width =
            parseFloat(field.style.width);

        const height =
            parseFloat(field.style.height);


        ctx.fillStyle = "black";

        ctx.font =
            Math.max(
                16,
                height * 0.65
            ) + "px Arial";

        ctx.textBaseline =
            "middle";

        ctx.direction = "ltr";

        ctx.fillText(
            input.value,
            x + 5,
            y + height / 2,
            width - 10
        );

    });


    /*
     * تنزيل الصورة النهائية.
     */

    const link =
        document.createElement("a");

    link.download =
        "filled-form.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();

});


</script>

</body>
</html>
