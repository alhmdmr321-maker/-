<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعبئة الصور</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
    direction: rtl;
}

.topbar {
    background: #111;
    color: white;
    padding: 12px;
    text-align: center;
}

.topbar h2 {
    margin: 0;
    font-size: 20px;
}

.toolbar {
    background: white;
    padding: 10px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

button,
.uploadButton {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    font-size: 15px;
    cursor: pointer;
}

.uploadButton {
    background: #1976d2;
    color: white;
}

.addButton {
    background: #673ab7;
    color: white;
}

.saveButton {
    background: #16803c;
    color: white;
}

input[type="file"] {
    display: none;
}

#status {
    width: 100%;
    text-align: center;
    color: #555;
    font-size: 14px;
}

.workspace {
    padding: 15px;
    overflow: auto;
}

#canvasArea {
    position: relative;
    margin: auto;
    width: fit-content;
    display: none;
}

#formImage {
    display: block;
    max-width: none;
    user-select: none;
    -webkit-user-drag: none;
}


/* ==========================
   مستطيل الكتابة
========================== */

#writingBox {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    
    width: min(90vw, 500px);
    
    background: white;
    border: 2px solid #1976d2;
    border-radius: 12px;
    
    padding: 8px;
    
    display: none;
    
    z-index: 5000;
    
    box-shadow: 0 5px 25px rgba(0,0,0,.3);
    
    direction: ltr;
}

#writingInput {
    width: calc(100% - 55px);
    min-height: 48px;
    
    border: none;
    outline: none;
    
    font-size: 18px;
    padding: 8px;
    
    resize: none;
    
    direction: auto;
}

#confirmText {
    width: 45px;
    height: 45px;
    
    background: #16803c;
    color: white;
    
    border-radius: 50%;
    
    font-size: 23px;
    font-weight: bold;
    
    padding: 0;
}


/* ==========================
   النص الموجود على الصورة
========================== */

.textItem {
    position: absolute;
    
    min-width: 30px;
    min-height: 30px;
    
    padding: 3px 6px;
    
    cursor: move;
    
    user-select: none;
    touch-action: none;
    
    font-size: 22px;
    color: #000;
    
    background: transparent;
    
    z-index: 20;
    
    white-space: pre-wrap;
    
    direction: auto;
}

.textItem.selected {
    outline: 2px dashed #1976d2;
    border-radius: 3px;
}

.deleteText {
    position: absolute;
    top: -28px;
    right: -5px;
    
    background: #d32f2f;
    color: white;
    
    border: none;
    border-radius: 50%;
    
    width: 25px;
    height: 25px;
    
    font-size: 14px;
    
    display: none;
}

.textItem.selected .deleteText {
    display: block;
}


/* ==========================
   تعليمات
========================== */

.help {
    background: white;
    margin: 10px auto;
    padding: 10px;
    border-radius: 10px;
    max-width: 700px;
    text-align: center;
    color: #555;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="topbar">
    <h2>تعبئة النموذج</h2>
</div>


<div class="toolbar">

    <label class="uploadButton">
        📷 اختيار صورة
        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >
    </label>

    <button
        class="addButton"
        id="addTextButton"
        type="button"
    >
        ✏️ إضافة كتابة
    </button>

    <button
        class="saveButton"
        id="saveButton"
        type="button"
    >
        💾 حفظ الصورة
    </button>

    <div id="status">
        اختر صورة للبدء
    </div>

</div>


<div class="help">
    بعد كتابة النص اضغط ✓، ثم اسحب الجملة وضعها في المكان الذي تريده على الصورة.
</div>


<div class="workspace">

    <div id="canvasArea">

        <img
            id="formImage"
            alt="النموذج"
        >

    </div>

</div>


<!-- ==========================
     مربع الكتابة
========================== -->

<div id="writingBox">

    <textarea
        id="writingInput"
        placeholder="اكتب الجملة هنا..."
        rows="2"
    ></textarea>

    <button
        id="confirmText"
        type="button"
        aria-label="تأكيد"
    >
        ✓
    </button>

</div>


<script>

const imageInput =
    document.getElementById("imageInput");

const formImage =
    document.getElementById("formImage");

const canvasArea =
    document.getElementById("canvasArea");

const writingBox =
    document.getElementById("writingBox");

const writingInput =
    document.getElementById("writingInput");

const confirmText =
    document.getElementById("confirmText");

const addTextButton =
    document.getElementById("addTextButton");

const saveButton =
    document.getElementById("saveButton");

const status =
    document.getElementById("status");


let imageLoaded = false;

let selectedText = null;

let textCounter = 0;


/* ==========================
   تحميل الصورة
========================== */

imageInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                formImage.onload =
                    function() {

                        imageLoaded = true;

                        canvasArea.style.display =
                            "block";

                        /*
                         * عرض الصورة بحجم مناسب
                         * للشاشة مع الحفاظ على
                         * أبعادها.
                         */

                        const maxWidth =
                            Math.min(
                                window.innerWidth - 30,
                                formImage.naturalWidth
                            );

                        formImage.style.width =
                            maxWidth + "px";

                        formImage.style.height =
                            "auto";

                        clearTexts();

                        status.textContent =
                            "الصورة جاهزة. اضغط «إضافة كتابة».";

                    };

                formImage.src =
                    e.target.result;

            };

        reader.readAsDataURL(file);

    }
);


/* ==========================
   فتح مربع الكتابة
========================== */

addTextButton.addEventListener(
    "click",
    function() {

        if (!imageLoaded) {

            alert("اختر صورة أولاً.");

            return;
        }

        openWritingBox();

    }
);


/* ==========================
   فتح نافذة الكتابة
========================== */

function openWritingBox() {

    writingInput.value = "";

    writingBox.style.display =
        "flex";

    writingInput.focus();

}


/* ==========================
   تأكيد النص
========================== */

confirmText.addEventListener(
    "click",
    function() {

        const text =
            writingInput.value.trim();

        if (!text) {

            writingInput.focus();

            return;
        }

        createTextItem(text);

        writingBox.style.display =
            "none";

    }
);


/* ==========================
   Enter + Ctrl/Command
========================== */

writingInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            (event.ctrlKey || event.metaKey)
        ) {

            event.preventDefault();

            confirmText.click();

        }

    }
);


/* ==========================
   إنشاء الجملة على الصورة
========================== */

function createTextItem(text) {

    const item =
        document.createElement("div");

    item.className =
        "textItem";

    item.textContent =
        text;

    item.dataset.id =
        ++textCounter;


    /*
     * زر حذف صغير يظهر فقط
     * عندما يتم تحديد النص.
     */

    const deleteButton =
        document.createElement("button");

    deleteButton.className =
        "deleteText";

    deleteButton.textContent =
        "×";

    deleteButton.type =
        "button";

    deleteButton.addEventListener(
        "pointerdown",
        function(event) {

            event.stopPropagation();

        }
    );

    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            item.remove();

            selectedText = null;

        }
    );


    item.appendChild(deleteButton);

    canvasArea.appendChild(item);


    /*
     * نضع النص في بداية الصورة
     * ويمكن للمستخدم سحبه مباشرة.
     */

    item.style.left =
        "20px";

    item.style.top =
        "20px";


    enableDragging(item);

    selectText(item);

}


/* ==========================
   تحديد النص
========================== */

function selectText(item) {

    document
        .querySelectorAll(".textItem")
        .forEach(el => {

            el.classList.remove("selected");

        });

    item.classList.add("selected");

    selectedText =
        item;

}


/* ==========================
   السحب باللمس أو الماوس
========================== */

function enableDragging(item) {

    let dragging = false;

    let startX = 0;
    let startY = 0;

    let originalLeft = 0;
    let originalTop = 0;


    item.addEventListener(
        "pointerdown",
        function(event) {

            /*
             * إذا ضغط المستخدم على
             * زر الحذف لا نبدأ السحب.
             */

            if (
                event.target.classList.contains(
                    "deleteText"
                )
            ) {
                return;
            }


            event.preventDefault();

            selectText(item);

            dragging = true;

            startX =
                event.clientX;

            startY =
                event.clientY;


            originalLeft =
                parseFloat(
                    item.style.left
                ) || 0;

            originalTop =
                parseFloat(
                    item.style.top
                ) || 0;


            item.setPointerCapture(
                event.pointerId
            );

        }
    );


    item.addEventListener(
        "pointermove",
        function(event) {

            if (!dragging) return;

            const dx =
                event.clientX -
                startX;

            const dy =
                event.clientY -
                startY;


            let newLeft =
                originalLeft + dx;

            let newTop =
                originalTop + dy;


            /*
             * إبقاء النص داخل الصورة.
             */

            const maxLeft =
                formImage.offsetWidth -
                item.offsetWidth;

            const maxTop =
                formImage.offsetHeight -
                item.offsetHeight;


            newLeft =
                Math.max(
                    0,
                    Math.min(
                        newLeft,
                        Math.max(0, maxLeft)
                    )
                );

            newTop =
                Math.max(
                    0,
                    Math.min(
                        newTop,
                        Math.max(0, maxTop)
                    )
                );


            item.style.left =
                newLeft + "px";

            item.style.top =
                newTop + "px";

        }
    );


    item.addEventListener(
        "pointerup",
        function(event) {

            dragging = false;

            try {

                item.releasePointerCapture(
                    event.pointerId
                );

            } catch (e) {}

        }
    );


    item.addEventListener(
        "pointercancel",
        function() {

            dragging = false;

        }
    );

}


/* ==========================
   الضغط خارج النص
========================== */

canvasArea.addEventListener(
    "pointerdown",
    function(event) {

        if (
            event.target === formImage
        ) {

            document
                .querySelectorAll(".textItem")
                .forEach(el => {

                    el.classList.remove(
                        "selected"
                    );

                });

            selectedText = null;

        }

    }
);


/* ==========================
   حذف النصوص القديمة
========================== */

function clearTexts() {

    document
        .querySelectorAll(".textItem")
        .forEach(item => {

            item.remove();

        });

    selectedText = null;

}


/* ==========================
   حفظ الصورة
========================== */

saveButton.addEventListener(
    "click",
    function() {

        if (!imageLoaded) {

            alert("اختر صورة أولاً.");

            return;
        }


        const canvas =
            document.createElement("canvas");

        canvas.width =
            formImage.naturalWidth;

        canvas.height =
            formImage.naturalHeight;


        const ctx =
            canvas.getContext("2d");


        /*
         * الصورة الأصلية.
         */

        ctx.drawImage(
            formImage,
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * نسبة الصورة الأصلية
         * إلى الصورة المعروضة.
         */

        const scaleX =
            formImage.naturalWidth /
            formImage.offsetWidth;

        const scaleY =
            formImage.naturalHeight /
            formImage.offsetHeight;


        /*
         * رسم جميع النصوص.
         */

        document
            .querySelectorAll(".textItem")
            .forEach(item => {

                const text =
                    item.childNodes[0]
                        ?.textContent || "";

                const x =
                    parseFloat(
                        item.style.left
                    ) * scaleX;

                const y =
                    parseFloat(
                        item.style.top
                    ) * scaleY;


                /*
                 * حجم الخط يتناسب
                 * مع حجم الصورة الأصلية.
                 */

                const fontSize =
                    22 * scaleX;


                ctx.fillStyle =
                    "#000000";

                ctx.font =
                    fontSize +
                    "px Arial";

                ctx.textBaseline =
                    "top";

                ctx.direction =
                    "ltr";


                /*
                 * يدعم النص العربي والألماني
                 * بشكل طبيعي.
                 */

                ctx.fillText(
                    text,
                    x + (4 * scaleX),
                    y + (3 * scaleY)
                );

            });


        /*
         * إنشاء الصورة النهائية.
         */

        const link =
            document.createElement("a");

        link.download =
            "filled-form.png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        link.click();


        status.textContent =
            "✅ تم حفظ الصورة النهائية.";

    }
);


/* ==========================
   إغلاق مربع الكتابة
   عند الضغط خارج المستطيل
========================== */

document.addEventListener(
    "pointerdown",
    function(event) {

        if (
            writingBox.style.display === "flex" &&
            !writingBox.contains(event.target) &&
            event.target !== addTextButton
        ) {

            writingBox.style.display =
                "none";

        }

    }
);

</script>

</body>
</html>
