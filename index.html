<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعبئة النموذج</title>

<!-- OCR لقياس حجم الكتابة الموجودة بالصورة -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
    direction: rtl;
}

.topbar {
    background: #111;
    color: white;
    padding: 12px;
    text-align: center;
}

.topbar h2 {
    margin: 0;
    font-size: 20px;
}

.toolbar {
    background: white;
    padding: 10px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

button,
.uploadButton {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    font-size: 15px;
    cursor: pointer;
}

.uploadButton {
    background: #1976d2;
    color: white;
}

.addButton {
    background: #673ab7;
    color: white;
}

.saveButton {
    background: #16803c;
    color: white;
}

input[type="file"] {
    display: none;
}

#status {
    width: 100%;
    text-align: center;
    color: #555;
    font-size: 14px;
}


/* =========================
   منطقة الصورة
========================= */

.workspace {
    padding: 15px;
    overflow: auto;
}

#canvasArea {
    position: relative;
    margin: auto;
    width: fit-content;
    display: none;
}

#formImage {
    display: block;
    max-width: none;
    user-select: none;
    -webkit-user-drag: none;
}


/* =========================
   مربع الكتابة
========================= */

#writingBox {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(90vw, 500px);

    background: white;

    border: 2px solid #1976d2;

    border-radius: 12px;

    padding: 8px;

    display: none;

    z-index: 5000;

    box-shadow: 0 5px 25px rgba(0,0,0,.3);

    direction: ltr;
}

#writingInput {
    width: calc(100% - 55px);

    min-height: 48px;

    border: none;

    outline: none;

    font-size: 18px;

    padding: 8px;

    resize: none;

    direction: auto;
}

#confirmText {
    width: 45px;
    height: 45px;

    background: #16803c;

    color: white;

    border-radius: 50%;

    font-size: 23px;

    font-weight: bold;

    padding: 0;
}


/* =========================
   النص الموجود فوق الصورة
========================= */

.textItem {
    position: absolute;

    min-width: 30px;
    min-height: 30px;

    padding: 2px 4px;

    cursor: move;

    user-select: none;

    touch-action: none;

    color: #000;

    background: transparent;

    z-index: 20;

    white-space: pre-wrap;

    direction: auto;

    line-height: 1.15;
}

.textItem.selected {
    outline: 2px dashed #1976d2;
    border-radius: 3px;
}

.deleteText {
    position: absolute;

    top: -28px;
    right: -5px;

    background: #d32f2f;
    color: white;

    border: none;

    border-radius: 50%;

    width: 25px;
    height: 25px;

    font-size: 14px;

    display: none;

    padding: 0;
}

.textItem.selected .deleteText {
    display: block;
}


/* =========================
   التعليمات
========================= */

.help {
    background: white;

    margin: 10px auto;

    padding: 10px;

    border-radius: 10px;

    max-width: 700px;

    text-align: center;

    color: #555;

    font-size: 14px;
}
</style>
</head>

<body>


<div class="topbar">
    <h2>تعبئة النموذج</h2>
</div>


<div class="toolbar">

    <label class="uploadButton">
        📷 اختيار صورة

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >
    </label>


    <button
        class="addButton"
        id="addTextButton"
        type="button"
    >
        ✏️ إضافة كتابة
    </button>


    <button
        class="saveButton"
        id="saveButton"
        type="button"
    >
        💾 حفظ الصورة
    </button>


    <div id="status">
        اختر صورة للبدء
    </div>

</div>


<div class="help">
    اكتب النص ثم اضغط ✓، وبعدها اسحب الجملة إلى المكان الذي تريده.
</div>


<div class="workspace">

    <div id="canvasArea">

        <img
            id="formImage"
            alt="النموذج"
        >

    </div>

</div>


<!-- =========================
     مستطيل الكتابة
========================= -->

<div id="writingBox">

    <textarea
        id="writingInput"
        placeholder="اكتب الجملة هنا..."
        rows="2"
    ></textarea>


    <button
        id="confirmText"
        type="button"
    >
        ✓
    </button>

</div>


<script>


const imageInput =
    document.getElementById("imageInput");

const formImage =
    document.getElementById("formImage");

const canvasArea =
    document.getElementById("canvasArea");

const writingBox =
    document.getElementById("writingBox");

const writingInput =
    document.getElementById("writingInput");

const confirmText =
    document.getElementById("confirmText");

const addTextButton =
    document.getElementById("addTextButton");

const saveButton =
    document.getElementById("saveButton");

const status =
    document.getElementById("status");


let imageLoaded = false;

let selectedText = null;

let textCounter = 0;


/*
 * حجم الخط المكتشف من الصورة
 * بوحدة بكسل في الصورة الأصلية.
 */
let detectedFontSize = 22;


/*
 * معامل عرض الصورة على الشاشة
 * مقارنة بالصورة الأصلية.
 */
let displayScale = 1;


/* ==================================================
   تحميل الصورة
================================================== */

imageInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                formImage.onload =
                    async function() {

                        imageLoaded = true;

                        canvasArea.style.display =
                            "block";


                        /*
                         * جعل الصورة مناسبة للشاشة.
                         */

                        const maxWidth =
                            Math.min(
                                window.innerWidth - 30,
                                formImage.naturalWidth
                            );


                        formImage.style.width =
                            maxWidth + "px";


                        formImage.style.height =
                            "auto";


                        updateDisplayScale();


                        clearTexts();


                        status.textContent =
                            "⏳ جاري قراءة حجم الخط الموجود في الصورة...";


                        /*
                         * قراءة الصورة وقياس
                         * أحجام الكلمات.
                         */

                        await detectFontSize(
                            e.target.result
                        );


                        status.textContent =
                            "✅ تم تحليل حجم الخط. اضغط «إضافة كتابة».";

                    };


                formImage.src =
                    e.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/* ==================================================
   حساب معامل التصغير
================================================== */

function updateDisplayScale() {

    if (
        !formImage.naturalWidth ||
        !formImage.offsetWidth
    ) {
        displayScale = 1;
        return;
    }


    displayScale =
        formImage.offsetWidth /
        formImage.naturalWidth;

}


/* ==================================================
   قراءة حجم الخط من الصورة
================================================== */

async function detectFontSize(imageSource) {

    try {

        /*
         * تشغيل OCR.
         *
         * الألمانية مناسبة للنموذج الحالي،
         * والإنجليزية تساعد مع النماذج الأخرى.
         */

        const result =
            await Tesseract.recognize(
                imageSource,
                "deu+eng"
            );


        const words =
            result.data.words || [];


        /*
         * أخذ ارتفاع الكلمات التي
         * استطاع OCR قراءتها.
         */

        const heights = [];


        for (const word of words) {

            if (!word.text) continue;


            const width =
                word.bbox.x1 -
                word.bbox.x0;


            const height =
                word.bbox.y1 -
                word.bbox.y0;


            /*
             * تجاهل النتائج غير المنطقية.
             */

            if (height < 6) continue;

            if (height > 100) continue;

            if (width < 3) continue;


            /*
             * نتجنب الكلمات القصيرة جداً
             * أو النتائج الغريبة.
             */

            heights.push(height);

        }


        if (heights.length === 0) {

            detectedFontSize = 22;

            return;

        }


        /*
         * ترتيب الأحجام.
         */

        heights.sort(
            (a,b) => a - b
        );


        /*
         * الوسيط Median أكثر استقراراً
         * من المتوسط.
         */

        const middle =
            Math.floor(
                heights.length / 2
            );


        let median;


        if (
            heights.length % 2 === 0
        ) {

            median =
                (
                    heights[middle - 1] +
                    heights[middle]
                ) / 2;

        } else {

            median =
                heights[middle];

        }


        /*
         * ارتفاع bbox للكلمة ليس دائماً
         * نفس حجم CSS font.
         *
         * لذلك نستخدم معامل صغير.
         */

        detectedFontSize =
            median * 1.05;


        /*
         * حدود أمان.
         */

        detectedFontSize =
            Math.max(
                10,
                Math.min(
                    detectedFontSize,
                    60
                )
            );


        console.log(
            "Detected font size:",
            detectedFontSize
        );


    } catch (error) {

        console.error(
            "OCR error:",
            error
        );


        /*
         * إذا فشل OCR نستخدم
         * قيمة احتياطية.
         */

        detectedFontSize = 22;

    }

}


/* ==================================================
   زر إضافة كتابة
================================================== */

addTextButton.addEventListener(
    "click",
    function() {

        if (!imageLoaded) {

            alert(
                "اختر صورة أولاً."
            );

            return;

        }


        openWritingBox();

    }
);


/* ==================================================
   فتح مستطيل الكتابة
================================================== */

function openWritingBox() {

    writingInput.value = "";

    writingBox.style.display =
        "flex";

    writingInput.focus();

}


/* ==================================================
   تأكيد الكتابة
================================================== */

confirmText.addEventListener(
    "click",
    function() {

        const text =
            writingInput.value.trim();


        if (!text) {

            writingInput.focus();

            return;

        }


        createTextItem(text);


        writingBox.style.display =
            "none";

    }
);


/* ==================================================
   Ctrl + Enter للتأكيد
================================================== */

writingInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            (event.ctrlKey || event.metaKey)
        ) {

            event.preventDefault();

            confirmText.click();

        }

    }
);


/* ==================================================
   إنشاء النص
================================================== */

function createTextItem(text) {

    const item =
        document.createElement("div");


    item.className =
        "textItem";


    item.dataset.id =
        ++textCounter;


    /*
     * نخزن النص بشكل منفصل حتى
     * لا يدخل زر الحذف ضمن النص.
     */

    const textNode =
        document.createTextNode(text);


    item.appendChild(textNode);


    /*
     * حجم الخط الطبيعي للصورة الأصلية.
     */

    item.dataset.fontSize =
        detectedFontSize;


    /*
     * تحويل الحجم إلى حجم مناسب
     * للصورة المعروضة على الشاشة.
     */

    item.style.fontSize =
        (
            detectedFontSize *
            displayScale
        ) + "px";


    /*
     * زر الحذف.
     */

    const deleteButton =
        document.createElement("button");


    deleteButton.className =
        "deleteText";


    deleteButton.textContent =
        "×";


    deleteButton.type =
        "button";


    deleteButton.addEventListener(
        "pointerdown",
        function(event) {

            event.stopPropagation();

        }
    );


    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            item.remove();

            selectedText = null;

        }
    );


    item.appendChild(
        deleteButton
    );


    canvasArea.appendChild(item);


    /*
     * مكان البداية.
     */

    item.style.left =
        "20px";


    item.style.top =
        "20px";


    enableDragging(item);


    selectText(item);

}


/* ==================================================
   تحديد النص
================================================== */

function selectText(item) {

    document
        .querySelectorAll(".textItem")
        .forEach(
            function(el) {

                el.classList.remove(
                    "selected"
                );

            }
        );


    item.classList.add(
        "selected"
    );


    selectedText =
        item;

}


/* ==================================================
   تحريك النص
================================================== */

function enableDragging(item) {

    let dragging = false;

    let startX = 0;

    let startY = 0;

    let originalLeft = 0;

    let originalTop = 0;


    item.addEventListener(
        "pointerdown",
        function(event) {

            if (
                event.target.classList.contains(
                    "deleteText"
                )
            ) {

                return;

            }


            event.preventDefault();


            selectText(item);


            dragging = true;


            startX =
                event.clientX;


            startY =
                event.clientY;


            originalLeft =
                parseFloat(
                    item.style.left
                ) || 0;


            originalTop =
                parseFloat(
                    item.style.top
                ) || 0;


            item.setPointerCapture(
                event.pointerId
            );

        }
    );


    item.addEventListener(
        "pointermove",
        function(event) {

            if (!dragging) return;


            const dx =
                event.clientX -
                startX;


            const dy =
                event.clientY -
                startY;


            let newLeft =
                originalLeft + dx;


            let newTop =
                originalTop + dy;


            const maxLeft =
                formImage.offsetWidth -
                item.offsetWidth;


            const maxTop =
                formImage.offsetHeight -
                item.offsetHeight;


            newLeft =
                Math.max(
                    0,
                    Math.min(
                        newLeft,
                        Math.max(
                            0,
                            maxLeft
                        )
                    )
                );


            newTop =
                Math.max(
                    0,
                    Math.min(
                        newTop,
                        Math.max(
                            0,
                            maxTop
                        )
                    )
                );


            item.style.left =
                newLeft + "px";


            item.style.top =
                newTop + "px";

        }
    );


    item.addEventListener(
        "pointerup",
        function(event) {

            dragging = false;


            try {

                item.releasePointerCapture(
                    event.pointerId
                );

            } catch (e) {}

        }
    );


    item.addEventListener(
        "pointercancel",
        function() {

            dragging = false;

        }
    );

}


/* ==================================================
   حذف كل النصوص
================================================== */

function clearTexts() {

    document
        .querySelectorAll(".textItem")
        .forEach(
            function(item) {

                item.remove();

            }
        );


    selectedText = null;

}


/* ==================================================
   حفظ الصورة
================================================== */

saveButton.addEventListener(
    "click",
    function() {

        if (!imageLoaded) {

            alert(
                "اختر صورة أولاً."
            );

            return;

        }


        const canvas =
            document.createElement("canvas");


        canvas.width =
            formImage.naturalWidth;


        canvas.height =
            formImage.naturalHeight;


        const ctx =
            canvas.getContext("2d");


        /*
         * رسم الصورة الأصلية.
         */

        ctx.drawImage(
            formImage,
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * معامل التحويل من الشاشة
         * إلى الصورة الأصلية.
         */

        const scaleX =
            formImage.naturalWidth /
            formImage.offsetWidth;


        const scaleY =
            formImage.naturalHeight /
            formImage.offsetHeight;


        /*
         * رسم النصوص.
         */

        document
            .querySelectorAll(".textItem")
            .forEach(
                function(item) {

                    /*
                     * أول Child هو النص.
                     */

                    const text =
                        item.childNodes[0]
                            ?.textContent || "";


                    if (!text) return;


                    const x =
                        (
                            parseFloat(
                                item.style.left
                            ) || 0
                        ) * scaleX;


                    const y =
                        (
                            parseFloat(
                                item.style.top
                            ) || 0
                        ) * scaleY;


                    /*
                     * نستخدم حجم الخط الذي
                     * اكتشفناه من الصورة الأصلية.
                     */

                    const fontSize =
                        parseFloat(
                            item.dataset.fontSize
                        ) || detectedFontSize;


                    ctx.fillStyle =
                        "#000000";


                    ctx.font =
                        fontSize +
                        "px Arial";


                    ctx.textBaseline =
                        "top";


                    ctx.direction =
                        "ltr";


                    ctx.fillText(
                        text,
                        x + 2,
                        y + 1
                    );

                }
            );


        /*
         * إنشاء الصورة النهائية.
         */

        const link =
            document.createElement("a");


        link.download =
            "filled-form.png";


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        link.click();


        status.textContent =
            "✅ تم حفظ الصورة بالحجم الصحيح للنص.";

    }
);


/* ==================================================
   الضغط خارج مربع الكتابة
================================================== */

document.addEventListener(
    "pointerdown",
    function(event) {

        if (
            writingBox.style.display === "flex" &&
            !writingBox.contains(event.target) &&
            event.target !== addTextButton
        ) {

            writingBox.style.display =
                "none";

        }

    }
);


/* ==================================================
   عند تغيير حجم الشاشة
================================================== */

window.addEventListener(
    "resize",
    function() {

        if (!imageLoaded) return;


        updateDisplayScale();


        /*
         * تحديث حجم النصوص الموجودة
         * حسب حجم الصورة الجديد.
         */

        document
            .querySelectorAll(".textItem")
            .forEach(
                function(item) {

                    const naturalSize =
                        parseFloat(
                            item.dataset.fontSize
                        ) || detectedFontSize;


                    item.style.fontSize =
                        (
                            naturalSize *
                            displayScale
                        ) + "px";

                }
            );

    }
);

</script>

</body>
</html>
