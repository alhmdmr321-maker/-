<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>تعبئة النموذج</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eee;
    font-family:Arial,sans-serif;
    direction:rtl;
}

.topbar{
    background:#111;
    color:white;
    padding:12px;
    text-align:center;
}

.topbar h2{
    margin:0;
    font-size:20px;
}

.toolbar{
    background:white;
    padding:10px;
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

button,
.uploadButton{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-size:15px;
    cursor:pointer;
}

.uploadButton{
    background:#1976d2;
    color:white;
}

.addButton{
    background:#673ab7;
    color:white;
}

.saveButton{
    background:#16803c;
    color:white;
}

input[type=file]{
    display:none;
}

#status{
    width:100%;
    text-align:center;
    color:#555;
    font-size:14px;
}

.help{
    background:white;
    margin:10px auto;
    padding:10px;
    border-radius:10px;
    max-width:700px;
    text-align:center;
    color:#555;
    font-size:14px;
}

.workspace{
    padding:15px;
    overflow:auto;
}

#canvasArea{
    position:relative;
    margin:auto;
    width:fit-content;
    display:none;
}

#formImage{
    display:block;
    max-width:none;
    user-select:none;
    -webkit-user-drag:none;
}

/* مربع الكتابة */

#writingBox{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(90vw,500px);
    background:white;
    border:2px solid #1976d2;
    border-radius:12px;
    padding:8px;
    display:none;
    z-index:5000;
    box-shadow:0 5px 25px rgba(0,0,0,.3);
    direction:ltr;
}

#writingInput{
    width:calc(100% - 55px);
    min-height:48px;
    border:0;
    outline:0;
    font-size:18px;
    padding:8px;
    resize:none;
    direction:auto;
    font-family:Arial,"Segoe UI Emoji","Noto Color Emoji",sans-serif;
}

#confirmText{
    width:45px;
    height:45px;
    background:#16803c;
    color:white;
    border-radius:50%;
    font-size:23px;
    font-weight:bold;
    padding:0;
}

/* النص فوق الصورة */

.textItem{
    position:absolute;
    min-width:30px;
    min-height:30px;
    padding:2px 4px;
    cursor:move;
    user-select:none;
    touch-action:none;
    color:#000;

    font-family:
        Arial,
        "Segoe UI Emoji",
        "Noto Color Emoji",
        sans-serif;

    background:transparent;
    z-index:20;
    white-space:pre-wrap;
    direction:auto;
    line-height:1.15;
}

.textItem.selected{
    outline:2px dashed #1976d2;
    border-radius:3px;
}

.deleteText{
    position:absolute;
    top:-28px;
    right:-5px;
    background:#d32f2f;
    color:white;
    border:0;
    border-radius:50%;
    width:25px;
    height:25px;
    font-size:14px;
    display:none;
    padding:0;
}

.textItem.selected .deleteText{
    display:block;
}

/* أزرار الحجم */

.sizeControl{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:#1976d2;
    color:white;
    font-size:28px;
    font-weight:bold;
    line-height:48px;
    padding:0;
    z-index:3000;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
}

.sizeControl:active{
    transform:translateY(-50%) scale(.92);
}

#increaseSize{
    left:10px;
}

#decreaseSize{
    right:10px;
}

.sizeControl:disabled{
    opacity:.35;
}
</style>
</head>

<body>

<div class="topbar">
    <h2>تعبئة النموذج</h2>
</div>

<div class="toolbar">

    <label class="uploadButton">
        📷 اختيار صورة
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <button
        class="addButton"
        id="addTextButton"
        type="button">
        ✏️ إضافة كتابة
    </button>

    <button
        class="saveButton"
        id="saveButton"
        type="button">
        💾 حفظ الصورة
    </button>

    <div id="status">
        اختر صورة للبدء
    </div>

</div>

<div class="help">
    اكتب النص ثم اضغط ✓، وبعدها اسحب الجملة إلى المكان الذي تريده.
    استخدم + و − بجانب الصورة لتغيير حجم الجملة المحددة.
</div>

<button
    id="increaseSize"
    class="sizeControl"
    type="button"
    aria-label="تكبير النص">
    +
</button>

<button
    id="decreaseSize"
    class="sizeControl"
    type="button"
    aria-label="تصغير النص">
    −
</button>

<div class="workspace">

    <div id="canvasArea">

        <img
            id="formImage"
            alt="النموذج">

    </div>

</div>

<div id="writingBox">

    <textarea
        id="writingInput"
        placeholder="اكتب الجملة هنا..."
        rows="2"></textarea>

    <button
        id="confirmText"
        type="button">
        ✓
    </button>

</div>

<script>

const imageInput =
    document.getElementById("imageInput");

const formImage =
    document.getElementById("formImage");

const canvasArea =
    document.getElementById("canvasArea");

const writingBox =
    document.getElementById("writingBox");

const writingInput =
    document.getElementById("writingInput");

const confirmText =
    document.getElementById("confirmText");

const addTextButton =
    document.getElementById("addTextButton");

const saveButton =
    document.getElementById("saveButton");

const status =
    document.getElementById("status");

const increaseSizeButton =
    document.getElementById("increaseSize");

const decreaseSizeButton =
    document.getElementById("decreaseSize");


let imageLoaded = false;
let selectedText = null;
let textCounter = 0;
let detectedFontSize = 22;
let displayScale = 1;


/* =========================
   تحميل الصورة
========================= */

imageInput.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];

        if(!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                formImage.onload =
                    async function(){

                        imageLoaded = true;

                        canvasArea.style.display =
                            "block";

                        const maxWidth =
                            Math.min(
                                window.innerWidth - 30,
                                formImage.naturalWidth
                            );

                        formImage.style.width =
                            maxWidth + "px";

                        formImage.style.height =
                            "auto";

                        updateDisplayScale();

                        clearTexts();

                        status.textContent =
                            "⏳ جاري قراءة حجم الخط الموجود بالصورة...";

                        await detectFontSize(
                            e.target.result
                        );

                        status.textContent =
                            "✅ تم تحليل حجم الخط. اضغط «إضافة كتابة».";

                    };

                formImage.src =
                    e.target.result;
            };

        reader.readAsDataURL(file);

    }
);


/* =========================
   معامل التصغير
========================= */

function updateDisplayScale(){

    if(
        !formImage.naturalWidth ||
        !formImage.offsetWidth
    ){
        displayScale = 1;
        return;
    }

    displayScale =
        formImage.offsetWidth /
        formImage.naturalWidth;
}


/* =========================
   قياس حجم الخط
========================= */

async function detectFontSize(imageSource){

    try{

        const result =
            await Tesseract.recognize(
                imageSource,
                "deu+eng"
            );

        const words =
            result.data.words || [];

        const heights = [];

        for(const word of words){

            if(!word.text) continue;

            const width =
                word.bbox.x1 -
                word.bbox.x0;

            const height =
                word.bbox.y1 -
                word.bbox.y0;

            if(height < 6) continue;
            if(height > 100) continue;
            if(width < 3) continue;

            heights.push(height);
        }

        if(heights.length){

            heights.sort(
                (a,b)=>a-b
            );

            const middle =
                Math.floor(
                    heights.length / 2
                );

            let median;

            if(heights.length % 2){

                median =
                    heights[middle];

            }else{

                median =
                    (
                        heights[middle-1] +
                        heights[middle]
                    ) / 2;
            }

            detectedFontSize =
                Math.max(
                    10,
                    Math.min(
                        median * 1.05,
                        60
                    )
                );
        }

    }catch(error){

        console.log(
            "OCR error:",
            error
        );

        detectedFontSize = 22;
    }
}


/* =========================
   إضافة كتابة
========================= */

addTextButton.addEventListener(
    "click",
    function(){

        if(!imageLoaded){

            alert(
                "اختر صورة أولاً."
            );

            return;
        }

        writingInput.value = "";

        writingBox.style.display =
            "flex";

        writingInput.focus();

    }
);


/* =========================
   تأكيد النص
========================= */

confirmText.addEventListener(
    "click",
    function(){

        const text =
            writingInput.value.trim();

        if(!text){

            writingBox.style.display =
                "none";

            return;
        }

        createTextItem(text);

        writingInput.value = "";

        writingBox.style.display =
            "none";

    }
);


/* Ctrl + Enter / Enter مع عدم النزول لسطر */

writingInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            confirmText.click();
        }

    }
);


/* =========================
   إنشاء النص
========================= */

function createTextItem(text){

    textCounter++;

    const item =
        document.createElement("div");

    item.className =
        "textItem";

    item.dataset.id =
        textCounter;

    item.dataset.fontSize =
        detectedFontSize;

    item.style.fontSize =
        (
            detectedFontSize *
            displayScale
        ) + "px";

    /*
     * نضع النص كـ text node مباشر.
     * هذا مهم حتى يبقى الإيموجي جزءاً
     * من نفس النص أثناء الحفظ.
     */

    const textNode =
        document.createTextNode(text);

    item.appendChild(textNode);

    const deleteButton =
        document.createElement("button");

    deleteButton.className =
        "deleteText";

    deleteButton.type =
        "button";

    deleteButton.textContent =
        "×";

    deleteButton.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            if(selectedText === item){
                selectedText = null;
            }

            item.remove();

            updateSizeButtons();

        }
    );

    item.appendChild(
        deleteButton
    );

    canvasArea.appendChild(
        item
    );

    /*
     * وضع النص تقريباً في منتصف الصورة.
     */

    const centerX =
        (
            formImage.offsetWidth -
            item.offsetWidth
        ) / 2;

    const centerY =
        (
            formImage.offsetHeight -
            item.offsetHeight
        ) / 2;

    item.style.left =
        Math.max(0,centerX) + "px";

    item.style.top =
        Math.max(0,centerY) + "px";

    enableDragging(item);

    selectText(item);
}


/* =========================
   تحديد النص
========================= */

function selectText(item){

    document
        .querySelectorAll(".textItem")
        .forEach(
            function(el){

                el.classList.remove(
                    "selected"
                );

            }
        );

    item.classList.add(
        "selected"
    );

    selectedText =
        item;

    updateSizeButtons();
}


/* =========================
   تحريك النص
========================= */

function enableDragging(item){

    let dragging = false;

    let startX = 0;
    let startY = 0;

    let originalLeft = 0;
    let originalTop = 0;

    item.addEventListener(
        "pointerdown",
        function(event){

            if(
                event.target.classList.contains(
                    "deleteText"
                )
            ){
                return;
            }

            event.preventDefault();

            selectText(item);

            dragging = true;

            startX =
                event.clientX;

            startY =
                event.clientY;

            originalLeft =
                parseFloat(
                    item.style.left
                ) || 0;

            originalTop =
                parseFloat(
                    item.style.top
                ) || 0;

            item.setPointerCapture(
                event.pointerId
            );

        }
    );

    item.addEventListener(
        "pointermove",
        function(event){

            if(!dragging) return;

            const dx =
                event.clientX -
                startX;

            const dy =
                event.clientY -
                startY;

            let newLeft =
                originalLeft + dx;

            let newTop =
                originalTop + dy;

            const maxLeft =
                formImage.offsetWidth -
                item.offsetWidth;

            const maxTop =
                formImage.offsetHeight -
                item.offsetHeight;

            newLeft =
                Math.max(
                    0,
                    Math.min(
                        newLeft,
                        Math.max(0,maxLeft)
                    )
                );

            newTop =
                Math.max(
                    0,
                    Math.min(
                        newTop,
                        Math.max(0,maxTop)
                    )
                );

            item.style.left =
                newLeft + "px";

            item.style.top =
                newTop + "px";

        }
    );

    item.addEventListener(
        "pointerup",
        function(event){

            dragging = false;

            try{

                item.releasePointerCapture(
                    event.pointerId
                );

            }catch(e){}

        }
    );

    item.addEventListener(
        "pointercancel",
        function(){

            dragging = false;

        }
    );
}


/* =========================
   تغيير حجم النص
========================= */

function updateSizeButtons(){

    const disabled =
        !selectedText;

    increaseSizeButton.disabled =
        disabled;

    decreaseSizeButton.disabled =
        disabled;
}


function changeSelectedFontSize(multiplier){

    if(!selectedText) return;

    const currentSize =
        parseFloat(
            selectedText.dataset.fontSize
        ) || detectedFontSize;

    let newSize =
        currentSize * multiplier;

    newSize =
        Math.max(
            6,
            Math.min(
                newSize,
                200
            )
        );

    selectedText.dataset.fontSize =
        newSize;

    selectedText.style.fontSize =
        (
            newSize *
            displayScale
        ) + "px";
}


increaseSizeButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();
        event.stopPropagation();

        changeSelectedFontSize(
            1.10
        );

    }
);


decreaseSizeButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();
        event.stopPropagation();

        changeSelectedFontSize(
            0.90
        );

    }
);


updateSizeButtons();


/* =========================
   حذف النصوص عند صورة جديدة
========================= */

function clearTexts(){

    document
        .querySelectorAll(".textItem")
        .forEach(
            function(item){
                item.remove();
            }
        );

    selectedText = null;

    updateSizeButtons();
}


/* =========================
   حفظ الصورة
========================= */

saveButton.addEventListener(
    "click",
    function(){

        if(!imageLoaded){

            alert(
                "اختر صورة أولاً."
            );

            return;
        }

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            formImage.naturalWidth;

        canvas.height =
            formImage.naturalHeight;

        const ctx =
            canvas.getContext("2d");


        /* الصورة الأصلية */

        ctx.drawImage(
            formImage,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const scaleX =
            formImage.naturalWidth /
            formImage.offsetWidth;

        const scaleY =
            formImage.naturalHeight /
            formImage.offsetHeight;


        /*
         * حفظ كل النصوص.
         */

        document
            .querySelectorAll(".textItem")
            .forEach(
                function(item){

                    const text =
                        item.childNodes[0]
                            ?.textContent || "";

                    if(!text) return;


                    const left =
                        parseFloat(
                            item.style.left
                        ) || 0;

                    const top =
                        parseFloat(
                            item.style.top
                        ) || 0;


                    const fontSize =
                        parseFloat(
                            item.dataset.fontSize
                        ) || detectedFontSize;


                    const computed =
                        getComputedStyle(item);


                    const paddingLeft =
                        parseFloat(
                            computed.paddingLeft
                        ) || 0;

                    const paddingTop =
                        parseFloat(
                            computed.paddingTop
                        ) || 0;


                    /*
                     * نفس خط الشاشة مع دعم الإيموجي.
                     */

                    ctx.font =
                        fontSize +
                        "px Arial, " +
                        "\"Segoe UI Emoji\", " +
                        "\"Noto Color Emoji\", " +
                        "sans-serif";


                    ctx.fillStyle =
                        "#000000";


                    /*
                     * مهم جداً:
                     *
                     * نستخدم top بدلاً من baseline
                     * حتى يكون موضع النص مطابقاً
                     * لموضعه داخل العنصر.
                     */

                    ctx.textBaseline =
                        "top";

                    ctx.textAlign =
                        "left";

                    /*
                     * نثبت اتجاه الرسم.
                     */

                    ctx.direction =
                        "ltr";


                    /*
                     * لا يوجد هنا +2 أو +1.
                     *
                     * والإيموجي يبدأ من نفس مكان
                     * بداية النص تماماً.
                     */

                    ctx.fillText(
                        text,
                        (
                            left +
                            paddingLeft
                        ) * scaleX,
                        (
                            top +
                            paddingTop
                        ) * scaleY
                    );

                }
            );


        /*
         * تنزيل الصورة.
         */

        const link =
            document.createElement(
                "a"
            );

        link.download =
            "filled-form.png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        link.click();

        status.textContent =
            "✅ تم حفظ الصورة بنجاح.";

    }
);


/* =========================
   الضغط خارج مربع الكتابة
========================= */

document.addEventListener(
    "pointerdown",
    function(event){

        if(
            writingBox.style.display === "flex" &&
            !writingBox.contains(event.target) &&
            event.target !== addTextButton
        ){

            writingBox.style.display =
                "none";
        }

    }
);


/* =========================
   تغيير حجم الشاشة
========================= */

window.addEventListener(
    "resize",
    function(){

        if(!imageLoaded) return;

        updateDisplayScale();

        document
            .querySelectorAll(".textItem")
            .forEach(
                function(item){

                    const size =
                        parseFloat(
                            item.dataset.fontSize
                        ) || detectedFontSize;

                    item.style.fontSize =
                        (
                            size *
                            displayScale
                        ) + "px";

                }
            );

    }
);

</script>

</body>
</html>
