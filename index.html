<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>تعبئة النموذج</title>


<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>


<style>

/* =========================================
   الإعدادات العامة
========================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;

    background:#eeeeee;

    font-family:
        Arial,
        "Segoe UI Emoji",
        "Noto Color Emoji",
        sans-serif;

    direction:rtl;
}


/* =========================================
   العنوان
========================================= */

.topbar{

    background:#111111;

    color:#ffffff;

    padding:14px;

    text-align:center;

}

.topbar h2{

    margin:0;

    font-size:22px;

}


/* =========================================
   شريط الأزرار
========================================= */

.toolbar{

    background:#ffffff;

    padding:12px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

    position:sticky;

    top:0;

    z-index:1000;

    box-shadow:
        0 2px 8px rgba(0,0,0,.15);

}


button,
.uploadButton{

    border:0;

    border-radius:10px;

    padding:11px 17px;

    font-size:16px;

    cursor:pointer;

    font-family:
        Arial,
        "Segoe UI Emoji",
        "Noto Color Emoji",
        sans-serif;

}


.uploadButton{

    background:#1976d2;

    color:#ffffff;

}


.addButton{

    background:#673ab7;

    color:#ffffff;

}


.saveButton{

    background:#16803c;

    color:#ffffff;

}


/* =========================================
   زر الحذف
   يظهر فقط عند تحديد النص
========================================= */

.deleteToolbarButton{

    background:#d32f2f;

    color:#ffffff;

    display:none;

    min-width:90px;

}


.deleteToolbarButton.show{

    display:block;

}


input[type="file"]{

    display:none;

}


#status{

    width:100%;

    text-align:center;

    color:#555555;

    font-size:14px;

}


/* =========================================
   التعليمات
========================================= */

.help{

    background:#ffffff;

    margin:10px auto;

    padding:12px 15px;

    border-radius:12px;

    max-width:760px;

    text-align:center;

    color:#555555;

    font-size:15px;

    line-height:1.8;

}


/* =========================================
   مساحة العمل
========================================= */

.workspace{

    padding:15px;

    overflow:auto;

}


#canvasArea{

    position:relative;

    margin:auto;

    width:fit-content;

    display:none;

}


/* =========================================
   صورة النموذج
========================================= */

#formImage{

    display:block;

    max-width:none;

    height:auto;

    user-select:none;

    -webkit-user-drag:none;

    pointer-events:auto;

}


/* =========================================
   مربع الكتابة
========================================= */

#writingBox{

    position:fixed;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    width:min(90vw,500px);

    background:#ffffff;

    border:2px solid #1976d2;

    border-radius:12px;

    padding:8px;

    display:none;

    align-items:center;

    z-index:5000;

    box-shadow:
        0 5px 25px rgba(0,0,0,.3);

    direction:ltr;

}


#writingInput{

    width:calc(100% - 55px);

    min-height:48px;

    border:0;

    outline:0;

    font-size:18px;

    padding:8px;

    resize:none;

    direction:auto;

    unicode-bidi:plaintext;

    font-family:
        Arial,
        "Segoe UI Emoji",
        "Noto Color Emoji",
        sans-serif;

}


#confirmText{

    width:45px;

    height:45px;

    padding:0;

    background:#16803c;

    color:#ffffff;

    border-radius:50%;

    font-size:23px;

    font-weight:bold;

    flex-shrink:0;

}


/* =========================================
   النص فوق الصورة
========================================= */

.textItem{

    position:absolute;

    min-width:30px;

    min-height:30px;

    padding:2px 4px;

    color:#000000;

    background:transparent;

    font-family:
        Arial,
        "Segoe UI Emoji",
        "Noto Color Emoji",
        sans-serif;

    white-space:pre-wrap;

    direction:auto;

    unicode-bidi:plaintext;

    line-height:1.15;

    z-index:20;

    cursor:move;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

    touch-action:none;

    pointer-events:auto;

}


/* =========================================
   عند تحديد النص
========================================= */

.textItem.selected{

    outline:2px dashed #1976d2;

    border-radius:3px;

}


/* =========================================
   أزرار تكبير وتصغير النص
========================================= */

.sizeControl{

    position:fixed;

    top:50%;

    transform:
        translateY(-50%);

    width:48px;

    height:48px;

    padding:0;

    border:0;

    border-radius:50%;

    background:#1976d2;

    color:#ffffff;

    font-size:29px;

    font-weight:bold;

    line-height:48px;

    z-index:3000;

    box-shadow:
        0 3px 10px rgba(0,0,0,.25);

}


.sizeControl:active{

    transform:
        translateY(-50%)
        scale(.92);

}


#increaseSize{

    left:10px;

}


#decreaseSize{

    right:10px;

}


.sizeControl:disabled{

    opacity:.35;

}


/* =========================================
   على الشاشات الصغيرة
========================================= */

@media(max-width:600px){

    .toolbar{

        gap:7px;

        padding:9px;

    }


    button,
    .uploadButton{

        font-size:15px;

        padding:10px 13px;

    }


    .help{

        font-size:14px;

        margin:8px;

    }

}

</style>

</head>


<body>


<!-- ========================================
     العنوان
========================================= -->

<div class="topbar">

    <h2>
        تعبئة النموذج
    </h2>

</div>



<!-- ========================================
     الأزرار
========================================= -->

<div class="toolbar">


    <label class="uploadButton">

        📷 اختيار صورة

        <input
            type="file"
            id="imageInput"
            accept="image/*">

    </label>



    <button
        class="addButton"
        id="addTextButton"
        type="button">

        ✏️ إضافة كتابة

    </button>



    <button
        class="saveButton"
        id="saveButton"
        type="button">

        💾 حفظ الصورة

    </button>



    <!--
        هذا الزر لا يظهر إلا بعد
        تحديد جملة.
    -->

    <button
        class="deleteToolbarButton"
        id="deleteSelectedButton"
        type="button">

        حذف

    </button>



    <div id="status">

        اختر صورة للبدء

    </div>


</div>



<!-- ========================================
     التعليمات
========================================= -->

<div class="help">

    اكتب النص ثم اضغط ✓،
    وبعدها اسحب الجملة إلى المكان الذي تريده.
    اضغط على الجملة لتحديدها،
    ثم استخدم + و − لتغيير حجمها
    أو اضغط «حذف» لحذفها.

</div>



<!-- ========================================
     أزرار حجم النص
========================================= -->

<button
    id="increaseSize"
    class="sizeControl"
    type="button"
    aria-label="تكبير النص">

    +

</button>



<button
    id="decreaseSize"
    class="sizeControl"
    type="button"
    aria-label="تصغير النص">

    −

</button>



<!-- ========================================
     مساحة الصورة
========================================= -->

<div class="workspace">


    <div id="canvasArea">


        <img
            id="formImage"
            alt="النموذج">


    </div>


</div>



<!-- ========================================
     مربع الكتابة
========================================= -->

<div id="writingBox">


    <textarea
        id="writingInput"
        placeholder="اكتب الجملة هنا..."
        rows="2"></textarea>


    <button
        id="confirmText"
        type="button">

        ✓

    </button>


</div>



<script>


/* =================================================
   العناصر
================================================= */

const imageInput =
    document.getElementById(
        "imageInput"
    );


const formImage =
    document.getElementById(
        "formImage"
    );


const canvasArea =
    document.getElementById(
        "canvasArea"
    );


const writingBox =
    document.getElementById(
        "writingBox"
    );


const writingInput =
    document.getElementById(
        "writingInput"
    );


const confirmText =
    document.getElementById(
        "confirmText"
    );


const addTextButton =
    document.getElementById(
        "addTextButton"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const status =
    document.getElementById(
        "status"
    );


const increaseSizeButton =
    document.getElementById(
        "increaseSize"
    );


const decreaseSizeButton =
    document.getElementById(
        "decreaseSize"
    );


const deleteSelectedButton =
    document.getElementById(
        "deleteSelectedButton"
    );


/* =================================================
   المتغيرات
================================================= */

let imageLoaded =
    false;


let selectedText =
    null;


let textCounter =
    0;


let detectedFontSize =
    22;


let displayScale =
    1;


/* =================================================
   حساب مقياس الصورة
================================================= */

function updateDisplayScale(){

    if(
        !formImage.naturalWidth ||
        !formImage.offsetWidth
    ){

        displayScale = 1;

        return;

    }


    displayScale =
        formImage.offsetWidth /
        formImage.naturalWidth;

}


/* =================================================
   تحميل الصورة
================================================= */

imageInput.addEventListener(
    "change",
    function(event){

        const file =
            event.target.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                formImage.onload =
                    async function(){

                        imageLoaded =
                            true;


                        canvasArea.style.display =
                            "block";


                        /*
                         * عرض الصورة بحجم مناسب للشاشة.
                         */

                        const maxWidth =
                            Math.min(
                                window.innerWidth - 30,
                                formImage.naturalWidth
                            );


                        formImage.style.width =
                            maxWidth + "px";


                        formImage.style.height =
                            "auto";


                        updateDisplayScale();


                        clearTexts();


                        status.textContent =
                            "⏳ جاري تحديد حجم الخط...";


                        await detectFontSize(
                            e.target.result
                        );


                        status.textContent =
                            "✅ تم تجهيز الصورة. اضغط «إضافة كتابة».";

                    };


                formImage.src =
                    e.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/* =================================================
   تحديد حجم الخط تلقائياً
================================================= */

async function detectFontSize(
    imageSource
){

    try{

        const result =
            await Tesseract.recognize(
                imageSource,
                "deu+eng"
            );


        const words =
            result.data.words || [];


        const heights = [];


        for(
            const word of words
        ){

            if(!word.text){

                continue;

            }


            const width =
                word.bbox.x1 -
                word.bbox.x0;


            const height =
                word.bbox.y1 -
                word.bbox.y0;


            if(height < 6){

                continue;

            }


            if(height > 100){

                continue;

            }


            if(width < 3){

                continue;

            }


            heights.push(
                height
            );

        }


        if(heights.length){

            heights.sort(
                (a,b)=>a-b
            );


            const middle =
                Math.floor(
                    heights.length / 2
                );


            let median;


            if(
                heights.length % 2
            ){

                median =
                    heights[middle];

            }else{

                median =
                    (
                        heights[middle - 1] +
                        heights[middle]
                    ) / 2;

            }


            detectedFontSize =
                Math.max(
                    10,
                    Math.min(
                        median * 1.05,
                        60
                    )
                );

        }

    }catch(error){

        console.log(
            "OCR error:",
            error
        );


        detectedFontSize =
            22;

    }

}


/* =================================================
   فتح مربع الكتابة
================================================= */

addTextButton.addEventListener(
    "click",
    function(){

        if(!imageLoaded){

            alert(
                "اختر صورة النموذج أولاً."
            );

            return;

        }


        writingInput.value =
            "";


        writingBox.style.display =
            "flex";


        writingInput.focus();

    }
);


/* =================================================
   تأكيد الكتابة
================================================= */

confirmText.addEventListener(
    "click",
    function(){

        const text =
            writingInput.value.trim();


        if(!text){

            writingBox.style.display =
                "none";

            return;

        }


        createTextItem(
            text
        );


        writingInput.value =
            "";


        writingBox.style.display =
            "none";

    }
);


/* =================================================
   زر Enter
================================================= */

writingInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            confirmText.click();

        }

    }
);


/* =================================================
   إنشاء الجملة
================================================= */

function createTextItem(
    text
){

    textCounter++;


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "textItem";


    item.dataset.id =
        textCounter;


    /*
     * حجم الخط الأصلي.
     */

    item.dataset.fontSize =
        detectedFontSize;


    item.style.fontSize =
        (
            detectedFontSize *
            displayScale
        ) + "px";


    /*
     * مهم:
     * نضع النص نفسه كـ Text Node.
     * هذا يحافظ على الإيموجي.
     */

    const textNode =
        document.createTextNode(
            text
        );


    item.appendChild(
        textNode
    );


    /*
     * وضع الجملة داخل الصورة.
     */

    item.style.left =
        "20px";


    item.style.top =
        "20px";


    canvasArea.appendChild(
        item
    );


    /*
     * تفعيل السحب.
     */

    enableDragging(
        item
    );


    /*
     * تحديد الجملة مباشرة.
     */

    selectText(
        item
    );

}


/* =================================================
   تحديد الجملة
================================================= */

function selectText(
    item
){

    /*
     * إزالة التحديد عن جميع الجمل.
     */

    document
        .querySelectorAll(
            ".textItem"
        )
        .forEach(
            function(el){

                el.classList.remove(
                    "selected"
                );

            }
        );


    /*
     * تحديد الجملة المطلوبة.
     */

    item.classList.add(
        "selected"
    );


    selectedText =
        item;


    updateControls();

}


/* =================================================
   إلغاء تحديد الجملة
================================================= */

function unselectText(){

    document
        .querySelectorAll(
            ".textItem"
        )
        .forEach(
            function(el){

                el.classList.remove(
                    "selected"
                );

            }
        );


    selectedText =
        null;


    updateControls();

}


/* =================================================
   تحديث حالة الأزرار
================================================= */

function updateControls(){

    const hasSelection =
        !!selectedText;


    /*
     * أزرار الحجم.
     */

    increaseSizeButton.disabled =
        !hasSelection;


    decreaseSizeButton.disabled =
        !hasSelection;


    /*
     * زر الحذف.
     */

    if(hasSelection){

        deleteSelectedButton.classList.add(
            "show"
        );

    }else{

        deleteSelectedButton.classList.remove(
            "show"
        );

    }

}


/* =================================================
   حذف الجملة المحددة
================================================= */

deleteSelectedButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();


        if(!selectedText){

            return;

        }


        const itemToDelete =
            selectedText;


        selectedText =
            null;


        itemToDelete.remove();


        updateControls();

    }
);


/* =================================================
   السحب باللمس والماوس
================================================= */

function enableDragging(
    item
){

    let dragging =
        false;


    let startX =
        0;


    let startY =
        0;


    let originalLeft =
        0;


    let originalTop =
        0;


    /*
     * عند الضغط على الجملة.
     */

    item.addEventListener(
        "pointerdown",
        function(event){

            /*
             * مهم جداً:
             * منع المتصفح من تمرير الصفحة
             * أثناء سحب الجملة.
             */

            event.preventDefault();

            event.stopPropagation();


            /*
             * تحديد الجملة فوراً.
             */

            selectText(
                item
            );


            dragging =
                true;


            startX =
                event.clientX;


            startY =
                event.clientY;


            originalLeft =
                parseFloat(
                    item.style.left
                ) || 0;


            originalTop =
                parseFloat(
                    item.style.top
                ) || 0;


            /*
             * تثبيت الإصبع على الجملة.
             */

            try{

                item.setPointerCapture(
                    event.pointerId
                );

            }catch(error){}

        }
    );


    /*
     * أثناء السحب.
     */

    item.addEventListener(
        "pointermove",
        function(event){

            if(!dragging){

                return;

            }


            event.preventDefault();

            event.stopPropagation();


            const dx =
                event.clientX -
                startX;


            const dy =
                event.clientY -
                startY;


            let newLeft =
                originalLeft +
                dx;


            let newTop =
                originalTop +
                dy;


            /*
             * حدود الصورة.
             */

            const maxLeft =
                formImage.offsetWidth -
                item.offsetWidth;


            const maxTop =
                formImage.offsetHeight -
                item.offsetHeight;


            /*
             * منع خروج الجملة
             * خارج الصورة.
             */

            newLeft =
                Math.max(
                    0,
                    Math.min(
                        newLeft,
                        Math.max(
                            0,
                            maxLeft
                        )
                    )
                );


            newTop =
                Math.max(
                    0,
                    Math.min(
                        newTop,
                        Math.max(
                            0,
                            maxTop
                        )
                    )
                );


            /*
             * تحديث المكان.
             */

            item.style.left =
                newLeft + "px";


            item.style.top =
                newTop + "px";

        }
    );


    /*
     * عند رفع الإصبع.
     */

    item.addEventListener(
        "pointerup",
        function(event){

            if(!dragging){

                return;

            }


            dragging =
                false;


            /*
             * تبقى الجملة محددة.
             */

            selectText(
                item
            );


            try{

                item.releasePointerCapture(
                    event.pointerId
                );

            }catch(error){}

        }
    );


    /*
     * في حالة إلغاء اللمس.
     */

    item.addEventListener(
        "pointercancel",
        function(event){

            dragging =
                false;


            try{

                item.releasePointerCapture(
                    event.pointerId
                );

            }catch(error){}

        }
    );

}


/* =================================================
   تغيير حجم الجملة
================================================= */

function changeSelectedFontSize(
    multiplier
){

    if(!selectedText){

        return;

    }


    const currentSize =
        parseFloat(
            selectedText.dataset.fontSize
        ) || detectedFontSize;


    let newSize =
        currentSize *
        multiplier;


    /*
     * الحد الأدنى والأقصى.
     */

    newSize =
        Math.max(
            6,
            Math.min(
                newSize,
                200
            )
        );


    selectedText.dataset.fontSize =
        newSize;


    selectedText.style.fontSize =
        (
            newSize *
            displayScale
        ) + "px";

}


/* =================================================
   تكبير
================================================= */

increaseSizeButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();


        changeSelectedFontSize(
            1.10
        );

    }
);


/* =================================================
   تصغير
================================================= */

decreaseSizeButton.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();


        changeSelectedFontSize(
            0.90
        );

    }
);


/* =================================================
   حذف جميع الجمل
================================================= */

function clearTexts(){

    document
        .querySelectorAll(
            ".textItem"
        )
        .forEach(
            function(item){

                item.remove();

            }
        );


    selectedText =
        null;


    updateControls();

}


/* =================================================
   الضغط على الصورة نفسها
================================================= */

formImage.addEventListener(
    "pointerdown",
    function(){

        /*
         * إذا ضغط المستخدم على مكان
         * فارغ من الصورة، نلغي التحديد.
         */

        unselectText();

    }
);


/* =================================================
   حفظ الصورة
================================================= */

saveButton.addEventListener(
    "click",
    async function(){

        if(!imageLoaded){

            alert(
                "اختر صورة النموذج أولاً."
            );

            return;

        }


        if(
            typeof html2canvas !==
            "function"
        ){

            alert(
                "تعذر تحميل أداة حفظ الصورة. تأكد من اتصال الإنترنت."
            );

            return;

        }


        /*
         * حفظ الجملة المحددة
         * حتى نعيد تحديدها بعد الحفظ.
         */

        const oldSelectedText =
            selectedText;


        /*
         * إزالة إطار التحديد
         * قبل أخذ الصورة.
         */

        unselectText();


        status.textContent =
            "⏳ جاري حفظ الصورة...";


        try{

            updateDisplayScale();


            /*
             * حساب التكبير المطلوب
             * حتى تكون النتيجة بالحجم الأصلي.
             */

            const captureScale =
                formImage.naturalWidth /
                formImage.offsetWidth;


            /*
             * تصوير الصورة والنصوص
             * كما تظهر فعلياً في المتصفح.
             *
             * لا نستخدم fillText هنا،
             * حتى لا يتغير مكان الإيموجي.
             */

            const capturedCanvas =
                await html2canvas(
                    canvasArea,
                    {

                        backgroundColor:null,

                        scale:
                            captureScale,

                        useCORS:true,

                        allowTaint:false,

                        logging:false,

                        imageTimeout:0

                    }
                );


            /*
             * Canvas نهائي بالحجم الأصلي.
             */

            const outputCanvas =
                document.createElement(
                    "canvas"
                );


            outputCanvas.width =
                formImage.naturalWidth;


            outputCanvas.height =
                formImage.naturalHeight;


            const outputCtx =
                outputCanvas.getContext(
                    "2d"
                );


            /*
             * نقل الصورة النهائية.
             */

            outputCtx.drawImage(
                capturedCanvas,

                0,
                0,

                outputCanvas.width,
                outputCanvas.height
            );


            /*
             * إنشاء رابط التحميل.
             */

            const link =
                document.createElement(
                    "a"
                );


            link.download =
                "filled-form.png";


            link.href =
                outputCanvas.toDataURL(
                    "image/png"
                );


            link.click();


            status.textContent =
                "✅ تم حفظ الصورة بنجاح.";


        }catch(error){

            console.error(
                "Save error:",
                error
            );


            status.textContent =
                "❌ حدث خطأ أثناء حفظ الصورة.";


            alert(
                "حدث خطأ أثناء حفظ الصورة. حاول مرة أخرى."
            );

        }


        /*
         * إعادة تحديد الجملة
         * التي كانت محددة قبل الحفظ.
         */

        if(
            oldSelectedText &&
            document.body.contains(
                oldSelectedText
            )
        ){

            selectText(
                oldSelectedText
            );

        }

    }
);


/* =================================================
   إغلاق مربع الكتابة عند الضغط خارجه
================================================= */

document.addEventListener(
    "pointerdown",
    function(event){

        if(
            writingBox.style.display === "flex" &&
            !writingBox.contains(
                event.target
            ) &&
            event.target !==
                addTextButton
        ){

            writingBox.style.display =
                "none";

        }

    }
);


/* =================================================
   تغيير حجم الشاشة
================================================= */

window.addEventListener(
    "resize",
    function(){

        if(!imageLoaded){

            return;

        }


        updateDisplayScale();


        document
            .querySelectorAll(
                ".textItem"
            )
            .forEach(
                function(item){

                    const size =
                        parseFloat(
                            item.dataset.fontSize
                        ) ||
                        detectedFontSize;


                    item.style.fontSize =
                        (
                            size *
                            displayScale
                        ) + "px";

                }
            );

    }
);


/* =================================================
   البداية
================================================= */

updateControls();

</script>
