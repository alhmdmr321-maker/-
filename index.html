<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعبئة النموذج</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eeeeee;
    font-family: Arial, sans-serif;
    direction: rtl;
}

#topbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: white;
    padding: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    font-size: 15px;
    cursor: pointer;
}

#uploadBtn {
    background: #333;
    color: white;
}

#saveBtn {
    background: #16803c;
    color: white;
}

#clearBtn {
    background: #b3261e;
    color: white;
}

#zoomIn,
#zoomOut {
    background: #ddd;
}

#status {
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: #555;
}

#fileInput {
    display: none;
}

#workspace {
    width: 100%;
    overflow: auto;
    padding: 15px;
}

#form {
    position: relative;
    margin: auto;
    width: fit-content;
    line-height: 0;
}

#formImage {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
}

.fieldInput {
    position: absolute;
    border: 1px dashed #777;
    background: rgba(255,255,255,0.55);
    outline: none;

    padding: 2px 5px;

    font-family: Arial, sans-serif;
    font-size: 18px;
    color: #000;

    line-height: 1.2;
    direction: auto;
    text-align: left;

    z-index: 10;
}

.fieldInput:focus {
    border: 1px solid #16803c;
    background: rgba(255,255,255,0.75);
}

@media (max-width: 600px) {
    .fieldInput {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div id="topbar">

    <label for="fileInput">
        <button id="uploadBtn" type="button">
            📷 اختيار النموذج
        </button>
    </label>

    <button id="saveBtn" type="button">
        💾 حفظ الصورة
    </button>

    <button id="clearBtn" type="button">
        🗑 مسح الكتابة
    </button>

    <button id="zoomOut" type="button">
        −
    </button>

    <button id="zoomIn" type="button">
        +
    </button>

    <input
        id="fileInput"
        type="file"
        accept="image/*"
    >

    <div id="status">
        اضغط فقط داخل الخانة الخضراء التي تريد تعبئتها
    </div>

</div>

<div id="workspace">

    <div id="form">

        <img
            id="formImage"
            alt="النموذج"
        >

    </div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const formImage = document.getElementById("formImage");
const form = document.getElementById("form");
const statusText = document.getElementById("status");

let imageLoaded = false;
let zoom = 1;

let fields = [];

/*
    أبعاد الصورة الأصلية:
    1448 × 2048

    هذه هي الخانات الحقيقية الموجودة
    في نموذج ORF الذي أرسلته.
*/

const FIELD_DATA = [

    // الاسم
    {
        name: "Nachname",
        x: 136,
        y: 614,
        w: 1174,
        h: 37
    },

    // الاسم الأول
    {
        name: "Vorname",
        x: 136,
        y: 683,
        w: 830,
        h: 37
    },

    // تاريخ الميلاد
    {
        name: "Geburtsdatum",
        x: 1033,
        y: 682,
        w: 277,
        h: 37
    },

    // الشارع
    {
        name: "Strasse",
        x: 136,
        y: 810,
        w: 1174,
        h: 38
    },

    // رقم المنزل
    {
        name: "Hausnummer",
        x: 136,
        y: 880,
        w: 244,
        h: 37
    },

    // Stiege
    {
        name: "Stiege",
        x: 551,
        y: 880,
        w: 140,
        h: 36
    },

    // Tür
    {
        name: "Tur",
        x: 410,
        y: 880,
        w: 108,
        h: 37
    },

    // PLZ
    {
        name: "PLZ",
        x: 136,
        y: 946,
        w: 142,
        h: 37
    },

    // Ort/Gemeinde
    {
        name: "Ort",
        x: 308,
        y: 947,
        w: 1002,
        h: 37
    },

    // Vorwahl
    {
        name: "Vorwahl",
        x: 136,
        y: 1017,
        w: 175,
        h: 38
    },

    // Telefonnummer
    {
        name: "Telefon",
        x: 342,
        y: 1017,
        w: 554,
        h: 37
    },

    // E-Mail
    {
        name: "Email",
        x: 136,
        y: 1087,
        w: 1173,
        h: 37
    },

    // Beitragsnummer
    {
        name: "Beitragsnummer",
        x: 961,
        y: 1245,
        w: 351,
        h: 40
    },

    // اسم شركة الهاتف
    {
        name: "Gesellschaft",
        x: 207,
        y: 1376,
        w: 1105,
        h: 37
    }

];


/* تحميل الصورة */

fileInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        formImage.onload = function() {

            imageLoaded = true;

            zoom = 1;

            renderFields();

            statusText.textContent =
                "اضغط داخل إحدى الخانات الخضراء للكتابة";

        };

        formImage.src = e.target.result;

    };

    reader.readAsDataURL(file);
});


/* إظهار الخانات */

function renderFields() {

    document
        .querySelectorAll(".fieldInput")
        .forEach(el => el.remove());

    fields = [];

    const naturalWidth = formImage.naturalWidth;
    const naturalHeight = formImage.naturalHeight;

    /*
       إذا كانت الصورة هي نفس النموذج
       نستخدم إحداثياته الأصلية.
    */

    FIELD_DATA.forEach(data => {

        const input = document.createElement("input");

        input.type = "text";

        input.className = "fieldInput";

        input.dataset.name = data.name;

        input.placeholder = "";

        /*
           تحويل إحداثيات الصورة الأصلية
           إلى النسبة المئوية.

           هذا يجعل الخانات تعمل حتى لو
           تغير حجم الصورة على الهاتف.
        */

        input.style.left =
            ((data.x / naturalWidth) * 100) + "%";

        input.style.top =
            ((data.y / naturalHeight) * 100) + "%";

        input.style.width =
            ((data.w / naturalWidth) * 100) + "%";

        input.style.height =
            ((data.h / naturalHeight) * 100) + "%";

        /*
           حفظ القيمة حتى نستخدمها
           عند تصدير الصورة.
        */

        input.addEventListener("input", function() {

            statusText.textContent =
                "تكتب الآن في خانة: " + data.name;

        });

        form.appendChild(input);

        fields.push({
            data: data,
            input: input
        });

    });

}


/*
   مهم جداً:

   لا يوجد هنا أي fallback.

   يعني إذا ضغط المستخدم خارج
   إحدى الخانات، لن تظهر خانة جديدة.
*/


/* التكبير */

document.getElementById("zoomIn")
.addEventListener("click", function() {

    if (!imageLoaded) return;

    zoom += 0.1;

    if (zoom > 2) zoom = 2;

    formImage.style.width =
        (zoom * 100) + "%";

    form.style.width =
        formImage.offsetWidth + "px";

});


/* التصغير */

document.getElementById("zoomOut")
.addEventListener("click", function() {

    if (!imageLoaded) return;

    zoom -= 0.1;

    if (zoom < 0.5) zoom = 0.5;

    formImage.style.width =
        (zoom * 100) + "%";

    form.style.width =
        formImage.offsetWidth + "px";

});


/* مسح الكتابة */

document.getElementById("clearBtn")
.addEventListener("click", function() {

    fields.forEach(field => {

        field.input.value = "";

    });

    statusText.textContent =
        "تم مسح الكتابة";

});


/* حفظ الصورة */

document.getElementById("saveBtn")
.addEventListener("click", function() {

    if (!imageLoaded) {

        alert("اختار صورة النموذج أولاً");

        return;

    }

    const canvas = document.createElement("canvas");

    const ctx = canvas.getContext("2d");

    canvas.width = formImage.naturalWidth;

    canvas.height = formImage.naturalHeight;

    /*
       أولاً نرسم النموذج الأصلي
    */

    ctx.drawImage(
        formImage,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       ثم نرسم الكتابة فقط.
       أزرار التطبيق والخانات الشفافة
       لن تدخل بالصورة النهائية.
    */

    fields.forEach(field => {

        const value =
            field.input.value.trim();

        if (!value) return;

        const d = field.data;

        let fontSize = Math.max(
            16,
            Math.floor(d.h * 0.65)
        );

        ctx.font =
            fontSize + "px Arial";

        ctx.fillStyle = "#000";

        ctx.textBaseline = "middle";

        /*
           دعم بسيط للنص العربي
        */

        const arabic =
            /[\u0600-\u06FF]/.test(value);

        if (arabic) {

            ctx.direction = "rtl";

            ctx.textAlign = "right";

            ctx.fillText(
                value,
                d.x + d.w - 5,
                d.y + d.h / 2
            );

        } else {

            ctx.direction = "ltr";

            ctx.textAlign = "left";

            ctx.fillText(
                value,
                d.x + 5,
                d.y + d.h / 2
            );

        }

    });


    /*
       تنزيل الصورة النهائية
    */

    const link =
        document.createElement("a");

    link.download =
        "ORF-Antrag-ausgefuellt.png";

    link.href =
        canvas.toDataURL("image/png");

    link.click();


    statusText.textContent =
        "تم حفظ النموذج بنجاح ✅";

});

</script>

</body>
</html>
