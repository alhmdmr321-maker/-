<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعبئة النموذج</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f1f1;
  font-family: Arial, sans-serif;
  color: #222;
}

header {
  background: white;
  padding: 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 23px;
}

.toolbar {
  width: 96%;
  max-width: 900px;
  margin: 12px auto;
  background: white;
  padding: 12px;
  border-radius: 12px;
}

button,
.fileButton {
  display: inline-block;
  padding: 12px 16px;
  margin: 4px;
  border: none;
  border-radius: 9px;
  background: #222;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.fileButton {
  background: #222;
}

input[type="file"] {
  display: none;
}

.instructions {
  margin-top: 10px;
  color: #666;
  line-height: 1.7;
  font-size: 14px;
}

.workspace {
  width: 96%;
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 10px;
  border-radius: 12px;
  overflow: auto;
}

#formArea {
  position: relative;
  display: inline-block;
  line-height: 0;
}

#formImage {
  display: none;
  max-width: none;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
}

#emptyMessage {
  padding: 50px 20px;
  text-align: center;
  color: #777;
  line-height: 2;
}

/* خانة الكتابة */

.field {
  position: absolute;
  z-index: 20;
  border: 2px solid #1976d2;
  background: rgba(255,255,255,.94);
  line-height: normal;
}

.field input {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  background: transparent;
  padding: 2px 5px;
  font-family: Arial,sans-serif;
  font-size: 16px;
  color: #000;
  direction: ltr;
}

.delete {
  position: absolute;
  top: -24px;
  right: 0;
  padding: 3px 7px;
  border-radius: 5px;
  background: #c62828;
  color: white;
  font-size: 11px;
  line-height: normal;
  cursor: pointer;
}

/* مربع الاختيار */

.checkbox {
  position: absolute;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.55);
  color: black;
  font-family: Arial,sans-serif;
  font-weight: bold;
  line-height: 1;
  cursor: pointer;
}

.message {
  display: none;
  margin-top: 8px;
  padding: 8px;
  border-radius: 7px;
  background: #eee;
  font-size: 14px;
}

.zoom {
  margin-top: 8px;
}
</style>
</head>

<body>

<header>
<h1>تعبئة النموذج</h1>
</header>

<div class="toolbar">

<label class="fileButton">
📷 اختيار صورة النموذج
<input type="file" id="imageInput" accept="image/*">
</label>

<button id="clearButton">
🗑️ مسح الخانات
</button>

<button id="saveButton">
💾 حفظ النموذج
</button>

<div class="instructions">
<b>طريقة الاستخدام:</b><br>
اضغط داخل الخانة الفارغة التي تريد تعبئتها.
إذا كانت خانة مستطيلة سيضع التطبيق الكتابة داخلها تلقائيًا.
اضغط على مربع اختيار حقيقي لوضع علامة ✓.
</div>

<div class="zoom">
<button id="minus">−</button>
<span id="zoomText">100%</span>
<button id="plus">+</button>
</div>

<div id="message" class="message"></div>

</div>

<div class="workspace">

<div id="formArea">

<div id="emptyMessage">
📄<br>
اختر صورة النموذج للبدء.
</div>

<img id="formImage">

</div>

</div>

<script>

const imageInput =
document.getElementById("imageInput");

const formImage =
document.getElementById("formImage");

const formArea =
document.getElementById("formArea");

const emptyMessage =
document.getElementById("emptyMessage");

const clearButton =
document.getElementById("clearButton");

const saveButton =
document.getElementById("saveButton");

const plus =
document.getElementById("plus");

const minus =
document.getElementById("minus");

const zoomText =
document.getElementById("zoomText");

const message =
document.getElementById("message");


let zoom = 1;

let fields = [];

let canvas = null;

let ctx = null;

let imageData = null;


/* =========================
   الرسائل
========================= */

function showMessage(text) {

  message.textContent = text;

  message.style.display = "block";

  clearTimeout(window.msgTimer);

  window.msgTimer =
    setTimeout(() => {
      message.style.display = "none";
    }, 2500);
}


/* =========================
   تحميل الصورة
========================= */

imageInput.addEventListener(
"change",
function() {

  const file = this.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    formImage.onload = function() {

      formImage.style.display = "block";

      emptyMessage.style.display = "none";

      zoom = 1;

      updateZoom();

      prepareImage();

      removeFields();

      showMessage(
        "تم تحميل النموذج. اضغط داخل الخانة التي تريد تعبئتها."
      );
    };

    formImage.src = e.target.result;

  };

  reader.readAsDataURL(file);

});


/* =========================
   تجهيز الصورة للتحليل
========================= */

function prepareImage() {

  canvas =
    document.createElement("canvas");

  canvas.width =
    formImage.naturalWidth;

  canvas.height =
    formImage.naturalHeight;

  ctx =
    canvas.getContext(
      "2d",
      {willReadFrequently:true}
    );

  ctx.drawImage(
    formImage,
    0,
    0
  );

  imageData =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );
}


/* =========================
   قراءة البكسل
========================= */

function pixel(x,y) {

  x = Math.round(x);
  y = Math.round(y);

  if (
    !imageData ||
    x < 0 ||
    y < 0 ||
    x >= imageData.width ||
    y >= imageData.height
  ) {
    return null;
  }

  const i =
    (y * imageData.width + x) * 4;

  return {

    r: imageData.data[i],

    g: imageData.data[i+1],

    b: imageData.data[i+2],

    a: imageData.data[i+3]

  };
}


/* =========================
   هل البكسل أخضر؟
========================= */

function green(p) {

  if (!p) return false;

  return (
    p.g > 100 &&
    p.g > p.r * 1.08 &&
    p.g > p.b * 1.03
  );
}


/* =========================
   هل البكسل أسود؟
========================= */

function black(p) {

  if (!p) return false;

  return (
    p.r < 80 &&
    p.g < 80 &&
    p.b < 80
  );
}


/* =========================
   قوة الخط الأخضر
========================= */

function greenHorizontal(
y,
x1,
x2
) {

  let good = 0;
  let total = 0;

  for (
    let x=x1;
    x<=x2;
    x+=2
  ) {

    const p = pixel(x,y);

    if (!p) continue;

    total++;

    if (green(p))
      good++;

  }

  if (!total) return 0;

  return good / total;
}


function greenVertical(
x,
y1,
y2
) {

  let good = 0;
  let total = 0;

  for (
    let y=y1;
    y<=y2;
    y+=2
  ) {

    const p = pixel(x,y);

    if (!p) continue;

    total++;

    if (green(p))
      good++;

  }

  if (!total) return 0;

  return good / total;
}


/* =========================
   البحث عن الخط العلوي
========================= */

function findTop(x,y) {

  const max = 180;

  for (
    let d=1;
    d<=max;
    d++
  ) {

    const yy = y-d;

    if (yy < 0) break;

    const score =
      greenHorizontal(
        yy,
        Math.max(0,x-40),
        Math.min(
          imageData.width-1,
          x+40
        )
      );

    if (score > .55) {

      return yy;
    }
  }

  return null;
}


/* =========================
   البحث عن الخط السفلي
========================= */

function findBottom(x,y) {

  const max = 180;

  for (
    let d=1;
    d<=max;
    d++
  ) {

    const yy = y+d;

    if (
      yy >= imageData.height
    ) break;

    const score =
      greenHorizontal(
        yy,
        Math.max(0,x-40),
        Math.min(
          imageData.width-1,
          x+40
        )
      );

    if (score > .55) {

      return yy;
    }
  }

  return null;
}


/* =========================
   البحث عن الخط الأيسر
========================= */

function findLeft(x,y) {

  const max = 350;

  for (
    let d=1;
    d<=max;
    d++
  ) {

    const xx=x-d;

    if (xx<0) break;

    const score =
      greenVertical(
        xx,
        Math.max(0,y-40),
        Math.min(
          imageData.height-1,
          y+40
        )
      );

    if (score>.55) {

      return xx;
    }
  }

  return null;
}


/* =========================
   البحث عن الخط الأيمن
========================= */

function findRight(x,y) {

  const max = 350;

  for (
    let d=1;
    d<=max;
    d++
  ) {

    const xx=x+d;

    if (
      xx>=imageData.width
    ) break;

    const score =
      greenVertical(
        xx,
        Math.max(0,y-40),
        Math.min(
          imageData.height-1,
          y+40
        )
      );

    if (score>.55) {

      return xx;
    }
  }

  return null;
}


/* =========================
   اكتشاف الخانة
========================= */

function detectField(x,y) {

  if (!imageData)
    return null;


  const top =
    findTop(x,y);

  const bottom =
    findBottom(x,y);

  const left =
    findLeft(x,y);

  const right =
    findRight(x,y);


  if (
    top === null ||
    bottom === null ||
    left === null ||
    right === null
  ) {

    return null;
  }


  const width =
    right-left;

  const height =
    bottom-top;


  /*
    الخانات المقبولة فقط
  */

  if (
    width < 35 ||
    height < 15
  ) {

    return null;
  }


  /*
    منع التقاط إطار الصفحة الكبير
  */

  if (
    width >
    imageData.width * .90
  ) {

    return null;
  }


  if (
    height >
    imageData.height * .35
  ) {

    return null;
  }


  /*
    منع الخانات البعيدة جدًا
  */

  if (
    x-left > 180 ||
    right-x > 180 ||
    y-top > 120 ||
    bottom-y > 120
  ) {

    return null;
  }


  return {

    x:left+2,

    y:top+2,

    width:width-4,

    height:height-4

  };

}


/* =========================
   اكتشاف مربع الاختيار
========================= */

function detectCheckbox(x,y) {

  /*
    نبحث عن مربع صغير فقط
  */

  for (
    let size=16;
    size<=38;
    size+=2
  ) {

    const half =
      size/2;


    const x1 =
      Math.round(x-half);

    const y1 =
      Math.round(y-half);

    const x2 =
      Math.round(x+half);

    const y2 =
      Math.round(y+half);


    let top=0;
    let bottom=0;
    let left=0;
    let right=0;


    for (
      let i=x1;
      i<=x2;
      i++
    ) {

      if (
        black(pixel(i,y1))
      )
        top++;

      if (
        black(pixel(i,y2))
      )
        bottom++;

    }


    for (
      let i=y1;
      i<=y2;
      i++
    ) {

      if (
        black(pixel(x1,i))
      )
        left++;

      if (
        black(pixel(x2,i))
      )
        right++;

    }


    /*
      يجب أن تكون هناك
      أربعة أضلاع للمربع
    */

    const threshold =
      size * .45;


    if (
      top > threshold &&
      bottom > threshold &&
      left > threshold &&
      right > threshold
    ) {

      return {

        x:x1,

        y:y1,

        size:size

      };

    }

  }


  return null;
}


/* =========================
   الضغط على الصورة
========================= */

formImage.addEventListener(
"pointerdown",
function(event) {

  if (!imageData)
    return;


  /*
    منع الضغط من الانتقال
  */

  event.preventDefault();


  const rect =
    formImage.getBoundingClientRect();


  const scaleX =
    formImage.naturalWidth /
    rect.width;


  const scaleY =
    formImage.naturalHeight /
    rect.height;


  const x =
    (event.clientX-rect.left)
    * scaleX;


  const y =
    (event.clientY-rect.top)
    * scaleY;


  /*
    أولاً مربع اختيار
  */

  const checkbox =
    detectCheckbox(x,y);


  if (checkbox) {

    addCheckbox(checkbox);

    return;
  }


  /*
    ثانيًا خانة نص
  */

  const field =
    detectField(x,y);


  if (field) {

    addTextField(field);

    return;
  }


  /*
    لا يوجد شيء
    لا نفعل أي شيء
  */

});


/* =========================
   إضافة خانة كتابة
========================= */

function addTextField(rectangle) {

  /*
    منع تكرار نفس الخانة
  */

  const duplicate =
    fields.find(
      f =>
        f.type==="text" &&
        Math.abs(
          f.x-rectangle.x
        ) < 8 &&
        Math.abs(
          f.y-rectangle.y
        ) < 8
    );


  if (duplicate) {

    const input =
      duplicate.element
      .querySelector("input");

    input.focus();

    return;
  }


  const div =
    document.createElement("div");

  div.className =
    "field";


  const input =
    document.createElement("input");

  input.type="text";

  input.autocomplete="off";

  input.spellcheck=false;


  const del =
    document.createElement("span");

  del.className="delete";

  del.textContent="حذف";


  del.addEventListener(
    "pointerdown",
    function(e) {

      e.stopPropagation();

      div.remove();

      fields =
        fields.filter(
          f => f.element!==div
        );

    }
  );


  div.appendChild(input);

  div.appendChild(del);

  formArea.appendChild(div);


  const item = {

    type:"text",

    element:div,

    x:rectangle.x,

    y:rectangle.y,

    width:rectangle.width,

    height:rectangle.height

  };


  fields.push(item);


  positionField(item);


  input.focus();

}


/* =========================
   إضافة مربع اختيار
========================= */

function addCheckbox(box) {

  /*
    منع تكرار نفس المربع
  */

  const duplicate =
    fields.find(
      f =>
        f.type==="checkbox" &&
        Math.abs(
          f.x-box.x
        ) < 10 &&
        Math.abs(
          f.y-box.y
        ) < 10
    );


  if (duplicate) {

    toggleCheckbox(
      duplicate
    );

    return;
  }


  const div =
    document.createElement("div");

  div.className =
    "checkbox";

  div.textContent="✓";


  formArea.appendChild(div);


  const item = {

    type:"checkbox",

    element:div,

    x:box.x,

    y:box.y,

    width:box.size,

    height:box.size,

    checked:true

  };


  fields.push(item);


  positionField(item);


  div.addEventListener(
    "pointerdown",
    function(e) {

      e.stopPropagation();

      toggleCheckbox(item);

    }
  );

}


/* =========================
   تشغيل / إلغاء الصح
========================= */

function toggleCheckbox(item) {

  item.checked =
    !item.checked;

  item.element.textContent =
    item.checked ? "✓" : "";

}


/* =========================
   تحديد مكان العنصر
========================= */

function positionField(item) {

  const scale =
    formImage.clientWidth /
    formImage.naturalWidth;


  item.element.style.left =
    (item.x*scale)+"px";


  item.element.style.top =
    (item.y*scale)+"px";


  item.element.style.width =
    (item.width*scale)+"px";


  item.element.style.height =
    (item.height*scale)+"px";


  if (
    item.type==="checkbox"
  ) {

    item.element.style.fontSize =
      Math.max(
        14,
        item.height*scale*.75
      )+"px";

  }

}


/* =========================
   التكبير
========================= */

function updateZoom() {

  const width =
    formImage.naturalWidth *
    zoom;


  formImage.style.width =
    width+"px";


  zoomText.textContent =
    Math.round(zoom*100)+"%";


  fields.forEach(
    positionField
  );

}


plus.addEventListener(
"click",
function() {

  zoom =
    Math.min(
      2.5,
      zoom+.1
    );

  updateZoom();

});


minus.addEventListener(
"click",
function() {

  zoom =
    Math.max(
      .5,
      zoom-.1
    );

  updateZoom();

});


/* =========================
   مسح الخانات
========================= */

function removeFields() {

  fields.forEach(
    f => {

      if (
        f.element
      )
        f.element.remove();

    }
  );

  fields=[];
}


clearButton.addEventListener(
"click",
function() {

  removeFields();

  showMessage(
    "تم مسح جميع الخانات."
  );

});


/* =========================
   إعادة ترتيب الخانات
========================= */

window.addEventListener(
"resize",
function() {

  fields.forEach(
    positionField
  );

});


/* =========================
   حفظ النموذج
========================= */

saveButton.addEventListener(
"click",
function() {

  if (
    !formImage.src ||
    !formImage.naturalWidth
  ) {

    showMessage(
      "اختر صورة النموذج أولاً."
    );

    return;
  }


  const output =
    document.createElement("canvas");


  output.width =
    formImage.naturalWidth;

  output.height =
    formImage.naturalHeight;


  const outputCtx =
    output.getContext("2d");


  /*
    الصورة الأصلية
  */

  outputCtx.drawImage(
    formImage,
    0,
    0,
    output.width,
    output.height
  );


  /*
    العناصر
  */

  fields.forEach(
    function(item) {


      if (
        item.type==="checkbox"
      ) {

        if (
          !item.checked
        )
          return;


        outputCtx.fillStyle =
          "#000";


        outputCtx.font =
          Math.max(
            16,
            item.height*.8
          )+"px Arial";


        outputCtx.textAlign =
          "center";


        outputCtx.textBaseline =
          "middle";


        outputCtx.fillText(
          "✓",

          item.x+
          item.width/2,

          item.y+
          item.height/2
        );


        return;

      }


      const input =
        item.element
        .querySelector("input");


      if (
        !input ||
        !input.value.trim()
      )
        return;


      /*
        تغطية مكان الكتابة
      */

      outputCtx.fillStyle =
        "white";


      outputCtx.fillRect(
        item.x,
        item.y,
        item.width,
        item.height
      );


      /*
        الكتابة
      */

      outputCtx.fillStyle =
        "#000";


      outputCtx.font =
        Math.max(
          12,
          item.height*.55
        )+"px Arial";


      outputCtx.textAlign =
        "left";


      outputCtx.textBaseline =
        "middle";


      outputCtx.fillText(
        input.value,

        item.x+5,

        item.y+
        item.height/2
      );

    }
  );


  /*
    إنشاء الملف
  */

  const link =
    document.createElement("a");


  link.download =
    "formular-ausgefuellt.png";


  link.href =
    output.toDataURL(
      "image/png"
    );


  link.click();


  showMessage(
    "تم حفظ النموذج."
  );

});

</script>

</body>
</html>
